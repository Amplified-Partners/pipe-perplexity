          # >>> VERBATIM harness/attempt_control.py (sync-enforced)
          #!/usr/bin/env python3
          """Deterministic local-journal reuse and failed-attempt control."""
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Callable, Mapping, Sequence

          from ai_call_receipt import (
              ReceiptValidationError,
              secure_regular_file,
              validate_scope,
          )

          ARTIFACT_SCHEMA = "governed-ai-result-artifact/v1"
          DECISION_SCHEMA = "ai-attempt-decision/v1"
          REVALIDATION_SCHEMA = "ai-revalidation-authorization/v1"
          REVALIDATION_FIELDS = frozenset(
              {
                  "schema",
                  "authorization_id",
                  "objective_id",
                  "scope",
                  "policy_version",
                  "expires_at",
                  "max_attempts",
              }
          )
          INFLIGHT_GRACE_SECONDS = 300


          def _prior_attempt_references(
              records: Sequence[Mapping[str, Any]],
              *,
              objective_id: str,
              scope: Mapping[str, Any],
          ) -> list[dict[str, Any]]:
              """Return content-free lifecycle references for this objective and scope."""
              governed_scope = validate_scope(scope)
              terminals = {
                  record.get("attempt_id"): record
                  for record in records
                  if record.get("event") == "attempt_terminal"
              }
              references = []
              for record in records:
                  if (
                      record.get("event") != "dispatch_started"
                      or record.get("scope") != governed_scope
                      or record.get("provider_metadata", {}).get("idempotency_id")
                      != objective_id
                  ):
                      continue
                  terminal = terminals.get(record.get("attempt_id"))
                  references.append(
                      {
                          "attempt_id": record.get("attempt_id"),
                          "event_id": record.get("event_id"),
                          "outcome": (
                              terminal.get("status") if terminal is not None else "outcome_unknown"
                          ),
                          "route": record.get("requested", {}).get("route"),
                          "fingerprint": record.get("fingerprint", {}).get("value"),
                      }
                  )
              return references


          def _revalidation_use(
              authorization: Mapping[str, Any] | None,
              records: Sequence[Mapping[str, Any]],
              *,
              objective_id: str,
              scope: Mapping[str, Any],
              policy_version: str,
              now: datetime,
              verifier: Callable[[Mapping[str, Any]], bool] | None,
          ) -> tuple[bool, str | None, int]:
              if authorization is None:
                  return False, None, 0
              if verifier is None or verifier(authorization) is not True:
                  raise ReceiptValidationError(
                      "revalidation authorization has no trusted verifier"
                  )
              if not isinstance(authorization, Mapping) or set(authorization) != REVALIDATION_FIELDS:
                  raise ReceiptValidationError("revalidation authorization has an invalid schema")
              governed_scope = validate_scope(scope)
              if (
                  authorization["schema"] != REVALIDATION_SCHEMA
                  or authorization["objective_id"] != objective_id
                  or authorization["scope"] != governed_scope
                  or authorization["policy_version"] != policy_version
              ):
                  raise ReceiptValidationError(
                      "revalidation authorization is not bound to this objective, scope and policy"
                  )
              authorization_id = authorization["authorization_id"]
              if (
                  not isinstance(authorization_id, str)
                  or not authorization_id
                  or len(authorization_id) > 256
              ):
                  raise ReceiptValidationError("authorization_id must be a bounded opaque string")
              max_attempts = authorization["max_attempts"]
              if (
                  not isinstance(max_attempts, int)
                  or isinstance(max_attempts, bool)
                  or max_attempts < 1
                  or max_attempts > 100
              ):
                  raise ReceiptValidationError("max_attempts must be between 1 and 100")
              try:
                  expires_at = datetime.fromisoformat(authorization["expires_at"])
              except (TypeError, ValueError) as exc:
                  raise ReceiptValidationError("expires_at must be an ISO-8601 timestamp") from exc
              if expires_at.tzinfo is None or expires_at <= now:
                  raise ReceiptValidationError("revalidation authorization is expired")
              uses = sum(
                  1
                  for record in records
                  if (
                      record.get("event") == "dispatch_started"
                      and record.get("scope") == governed_scope
                      and record.get("provider_metadata", {}).get("idempotency_id") == objective_id
                      and record.get("provider_metadata", {}).get("revalidation_grant_id")
                      == authorization_id
                  )
              )
              return uses < max_attempts, authorization_id, uses


          def verify_result_artifact(
              pointer: str | os.PathLike[str],
              *,
              fingerprint: str,
              scope: Mapping[str, Any],
              policy_version: str,
          ) -> str:
              """Return a governed result path only when pointer, scope and bytes verify."""
              pointer_path = Path(pointer)
              with secure_regular_file(pointer_path) as stream:
                  metadata = json.load(stream)
              allowed = {
                  "schema", "fingerprint", "scope", "policy_version", "result_path",
                  "result_sha256", "revoked",
              }
              if not isinstance(metadata, dict) or set(metadata) != allowed:
                  raise ReceiptValidationError("result artifact pointer has an invalid schema")
              if (
                  metadata["schema"] != ARTIFACT_SCHEMA
                  or metadata["fingerprint"] != fingerprint
                  or metadata["scope"] != validate_scope(scope)
                  or metadata["policy_version"] != policy_version
                  or metadata["revoked"] is not False
              ):
                  raise ReceiptValidationError("result artifact is not authorized for this call")
              relative_result = Path(metadata["result_path"])
              if relative_result.is_absolute() or ".." in relative_result.parts:
                  raise ReceiptValidationError("result_path must be relative and cannot traverse")
              result_path = pointer_path.parent / relative_result
              digest = hashlib.sha256()
              with secure_regular_file(result_path, binary=True) as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != metadata["result_sha256"]:
                  raise ReceiptValidationError("result artifact integrity check failed")
              return str(result_path)


          def decide_attempt(
              records: Sequence[Mapping[str, Any]],
              *,
              fingerprint: str | None,
              objective_id: str,
              route: str,
              scope: Mapping[str, Any],
              policy_version: str,
              failure_ceiling: int,
              artifact_pointer: str | os.PathLike[str] | None = None,
              revalidation_authorization: Mapping[str, Any] | None = None,
              revalidation_verifier: Callable[[Mapping[str, Any]], bool] | None = None,
              now: datetime | None = None,
          ) -> dict[str, Any]:
              """Decide reuse, block, or dispatch from immutable local receipt facts.

              Failure budget is objective-wide: changing route never resets it.
              """
              if not objective_id or failure_ceiling < 1:
                  raise ReceiptValidationError("objective_id and positive failure_ceiling required")
              governed_scope = validate_scope(scope)
              prior_attempts = _prior_attempt_references(
                  records, objective_id=objective_id, scope=governed_scope
              )
              has_successful_exact_match = False
              objective_attempts: dict[str, dict[str, Any]] = {}
              for record in records:
                  if (
                      record.get("status") == "success"
                      and record.get("fingerprint", {}).get("value") == fingerprint
                      and record.get("scope") == governed_scope
                  ):
                      has_successful_exact_match = True
                  metadata = record.get("provider_metadata", {})
                  # objective_id is an opaque, caller-governed id carried in idempotency_id.
                  if metadata.get("idempotency_id") != objective_id:
                      continue
                  attempt_id = record.get("attempt_id")
                  if not isinstance(attempt_id, str):
                      continue
                  lifecycle = objective_attempts.setdefault(attempt_id, {})
                  if record.get("event") == "dispatch_started":
                      lifecycle["started"] = record
                  elif record.get("event") in {"attempt_terminal", "dispatch_blocked"}:
                      lifecycle["terminal"] = record

              decision_time = now or datetime.now(timezone.utc)
              objective_failures = 0
              for lifecycle in objective_attempts.values():
                  terminal = lifecycle.get("terminal")
                  if terminal is not None:
                      if terminal.get("status") != "success":
                          objective_failures += 1
                      continue
                  started = lifecycle.get("started")
                  if started is None:
                      continue
                  try:
                      started_at = datetime.fromisoformat(started["timestamp"])
                  except (KeyError, TypeError, ValueError):
                      # Missing time cannot prove that work is still live, so fail closed.
                      objective_failures += 1
                      continue
                  if started_at.tzinfo is None:
                      objective_failures += 1
                      continue
                  if (decision_time - started_at).total_seconds() >= INFLIGHT_GRACE_SECONDS:
                      objective_failures += 1

              if has_successful_exact_match and artifact_pointer is not None and fingerprint is not None:
                  result = verify_result_artifact(
                      artifact_pointer,
                      fingerprint=fingerprint,
                      scope=governed_scope,
                      policy_version=policy_version,
                  )
                  return {
                      "schema": DECISION_SCHEMA, "action": "reuse", "reason": "exact_governed_result",
                      "result_path": result, "route": route, "prior_attempts": prior_attempts,
                  }

              authorized, authorization_id, authorization_uses = _revalidation_use(
                  revalidation_authorization,
                  records,
                  objective_id=objective_id,
                  scope=governed_scope,
                  policy_version=policy_version,
                  now=decision_time,
                  verifier=revalidation_verifier,
              )
              if objective_failures >= failure_ceiling and not authorized:
                  return {
                      "schema": DECISION_SCHEMA, "action": "block",
                      "reason": "objective_failure_ceiling", "failure_count": objective_failures,
                      "route": route, "prior_attempts": prior_attempts,
                  }
              decision = {
                  "schema": DECISION_SCHEMA, "action": "dispatch",
                  "reason": "no_reusable_governed_result",
                  "failure_count": max(objective_failures, 0), "route": route,
                  "prior_attempts": prior_attempts,
              }
              if objective_failures >= failure_ceiling:
                  decision["revalidation_authorization"] = {
                      "authorization_id": authorization_id,
                      "uses": authorization_uses,
                      "max_attempts": revalidation_authorization["max_attempts"],
                  }
                  decision["receipt_provider_metadata"] = {
                      "revalidation_grant_id": authorization_id,
                  }
              return decision
