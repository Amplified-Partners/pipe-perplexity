name: verifier-gate
# Amplified principle: verification is third-party — no seat ratifies its own work.
# This gate passes only on a current-head staged manifest: two DeepSeek and two
# Kimi specialist instances, reciprocal cross-validation, then OpenAI APPROVE.
# The implementation is a disposable hypothesis; the principle is the goal.
#
# v2 2026-07-23 | Seat: claude-cowork (Ewan's session) | changes + backing:
#   1. IDENTITY DE-COLLAPSE: Five Rods and the DeepSeek review-only substrate
#      both post via GITHUB_TOKEN as github-actions[bot]; v1 keyed reviewers by
#      login, so two independent substrates counted as ONE reviewer and quorum
#      was unreachable from self-hosted reviewers alone (observed estate-wide
#      2026-07-23, e.g. intent-interface#20). v2 keys github-actions[bot]
#      reviews by their body marker (Five Rods / DeepSeek); unknown bodies
#      still collapse to the bare login, so the split is closed-set.
#   2. CODEX SUMMON REMOVED: chatgpt-codex-connector[bot] is over quota and
#      answers every summon with a usage-limit comment, not a review (observed
#      on 15+ PRs, 2026-07-23). Re-add to SUMMONS when quota is restored.
#   3. LOOP DAMPING: v1 summoned on synchronize; Bugbot Autofix pushes reset
#      the head SHA, invalidating reviews and re-triggering summon -> review ->
#      autofix -> push (loop observed on amplified-fleet-config#160). v2
#      summons only on opened/reopened/ready_for_review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  # merge_group is REQUIRED once verifier-gate is a required status check:
  # the merge queue builds a synthetic merge commit and waits for every
  # required context to report on it. Without this trigger the queue waits
  # forever and silently drops the entry (measured 2026-07-23: #210 and #214
  # queued, estate-gate + vault-ci reported on the merge_group head at 20:53
  # and 21:55, verifier-gate never did, both entries expired).
  merge_group: {}
# v3 2026-08-05 | Seat: cascade-mac | the re-trigger gap is closed by WAITING,
# not by re-firing. Prior art and why it was removed:
#   fr_e605967670a7 (2026-08-03) correctly identified the gap — bot reviews are
#   posted with GITHUB_TOKEN and start no workflow, so pull_request_review never
#   fires for them — but the workflow_run remedy cannot reach a PR. A
#   workflow_run-triggered run executes against the DEFAULT BRANCH, so its check
#   run attaches to main's SHA, never the PR head, and a required context on the
#   PR is unaffected. Measured 2026-08-05 on this repo: 20 verifier-gate check
#   runs accumulated on origin/main (13 success, 7 FAILURE — the gate was
#   painting the default branch red for PR-shaped reasons), while 0 of 38
#   PR-head failures in the preceding 200 runs were ever cleared by a
#   workflow_run re-fire. The trigger was pure cost: junk checks on main, zero
#   healing. Removed. The single pull_request run per head SHA now waits for the
#   validator chain itself (see "await the validator chain" below), so there is
#   one run, one verdict, and no cross-workflow re-entry to get wrong.
concurrency:
  # A superseded head has no verdict worth waiting for: cancel the old wait as
  # soon as a new push arrives, mirroring validator-pipeline's own concurrency
  # (ci.yml). Without this, a 20-minute wait would outlive the SHA it describes.
  group: verifier-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  pull-requests: read
  checks: read
  actions: read   # listWorkflowRunsForRepo: tells a queued chain from an unwired one
jobs:
  verifier-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # hard backstop for the in-job wait below (DEADLINE_MS is 25min)
    permissions:
      # Read-only, and deliberately so: this job only ever OBSERVES. It calls
      # pulls.listFiles, pulls.listReviews, checks.listForRef and
      # actions.listWorkflowRunsForRepo, and nothing else.
      #
      # `issues: write` stood here until 2026-08-05 as a leftover from the v2
      # SUMMONS removal — a standing write grant with no remaining consumer, on
      # a required gate propagated to five repos. Removed per the constitution's
      # least-privilege property; restore it only alongside code that needs it.
      pull-requests: read
      checks: read
      actions: read   # see top-level note
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Merge-queue entries: quorum was already enforced at PR level —
            // a PR cannot ENTER the queue until every required check,
            // verifier-gate included, has succeeded on its head. The merge_group
            // payload carries no pull_request, and reviews cannot bind to the
            // synthetic merge commit, so re-counting here is impossible by
            // construction, not skipped by choice. Pass through; PR-level
            // enforcement is the gate. (Same shape as GitHub's own review
            // requirements, which are PR-level, not merge-commit-level.)
            if (context.eventName === 'merge_group') {
              core.info('merge_group: quorum enforced at PR stage; pass-through.');
              return;
            }
            const pr = context.payload.pull_request;
            if (!pr || !pr.head || !pr.user) {
              core.setFailed(`Verifier gate: unsupported event ${context.eventName} or missing PR payload.`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100 });
            const docsOnly = files.length > 0
              && files.every(f => f.filename.startsWith('docs/') && f.filename.endsWith('.md'));
            const touchesPrePublication = files.some(
              f => f.filename.includes('docs/decided/') || f.filename.includes('pre-publication/')
            );
            if (docsOnly && touchesPrePublication) {
              core.info('pre-publication docs-only change: dispatch scrub forbids outbound validator payloads; pass-through.');
              return;
            }
            const author = pr.user.login;
            // Dependency-bot PRs: quorum is impossible by construction, not
            // skipped by choice. Dependabot-triggered workflows receive
            // Dependabot secrets, not Actions secrets, so every reviewer key
            // resolves empty and no specialist can ever post (measured
            // 2026-07-27 org-wide: "MOONSHOT_API_KEY is not set"). Failing here
            // would report "quorum not met" when the truth is "quorum could not
            // be attempted" — a false signal on a required check. Dependency
            // bumps are governed by the deterministic checks, which run at full
            // force. Narrow by design: the bot login alone takes this path, so
            // no human- or agent-authored PR can. Mirrors the applicability
            // gate in ai-review-reusable.yml; both stop being taken once
            // org-level Dependabot secrets exist.
            if (author === 'dependabot[bot]') {
              core.info(`${author}: reviewer keys unavailable to Dependabot-triggered runs by GitHub design; deterministic checks govern. Pass-through.`);
              return;
            }
            const headSha = pr.head.sha;
            // Review-source key: distinct logins are distinct sources; for
            // github-actions[bot] (shared login for self-hosted reviewers),
            // split by known body markers only (closed set — unknown bodies
            // collapse to the bare login rather than minting new sources).
            const sourceKey = (r) => {
              if (r.user.login !== 'github-actions[bot]') return r.user.login;
              const b = r.body || '';
              if (b.includes('Five Rods Review')) return 'github-actions[bot]:five-rods';
              if (b.includes('DeepSeek independent review')) return 'github-actions[bot]:deepseek';
              if (b.includes('OpenAI independent review')) return 'github-actions[bot]:openai';
              if (b.includes('Codex API independent review')) return 'github-actions[bot]:openai';  // legacy marker, same source
              if (b.includes('Kimi independent review')) return 'github-actions[bot]:kimi';
              if (b.includes('OpenAI final approval')) return 'github-actions[bot]:openai-final';
              return r.user.login;
            };
            // Current-head final approval, re-read on each poll. Head-binding is
            // the r.commit_id !== headSha filter below; proven by
            // tests/test_verifier_gate_wait.py::test_manifest_arriving_mid_wait_exits_the_loop.
            const readFinalReview = async () => {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number });
              const latest = new Map();
              for (const r of reviews) {
                if (!r.user || r.user.login === author) continue;
                if (r.state === 'PENDING') continue;
                if (r.commit_id !== headSha) continue;
                const key = sourceKey(r);
                const prev = latest.get(key);
                if (!prev || new Date(r.submitted_at) > new Date(prev.submitted_at)) latest.set(key, r);
              }
              const active = [...latest.entries()].filter(([, r]) => r.state !== 'DISMISSED');
              return active.find(([key]) => key === 'github-actions[bot]:openai-final')?.[1];
            };
            // Await the validator chain instead of false-failing ahead of it.
            //
            // The gate fires on synchronize, when the chain for this head has by
            // definition not run yet, so an absent manifest at t=0 means "not yet
            // produced", NOT "verification failed". v2 collapsed those two states
            // and reported FAILURE for both: measured 2026-08-05, 18 of 60
            // pull_request runs (30%) went red this way, each one red for the
            // 15-20min the chain takes. A gate whose resting state on every push
            // is red carries no signal.
            //
            // Distinguishing them needs no new trust: the chain publishes its own
            // check run on this head SHA, so "has the chain finished" is directly
            // observable. Absent-and-chain-running is pending; absent-and-chain-
            // finished is a real failure and still fails closed. Nothing here
            // weakens verification — the manifest checks below are unchanged and
            // still run in full.
            //
            // This is what makes the ai-review-reusable "nudge verifier-gate
            // re-run" step unnecessary: a waiting run needs no re-entry, which
            // removes the `gh run rerun --limit 1` head-SHA race and its silent
            // `2>/dev/null || echo` swallow. Concurrency above cancels a wait
            // whose head has been superseded.
            // Measured 2026-08-05 against a real head in each fan-out repo
            // (gh api .../check-runs --jq '.check_runs[].name'): this vault,
            // estate-facilitator, amp-deepseek-work and product-verdant all
            // publish 'validator-pipeline / review' (a reusable-workflow check is
            // named '<caller job id> / <called job id>'); amp-deepseek-config
            // hosts its chain as 'ai-review'. Both names are listed because this
            // file is propagated verbatim to every one of those repos — a name
            // that does not exist in a given repo simply never matches. Re-measure
            // before adding a repo to the fan-out; a name missing here makes the
            // gate report "chain not wired" when the chain is in fact running.
            const VALIDATOR_CHECKS = ['validator-pipeline / review', 'ai-review'];
            // queued  = no validator check yet, but Actions still has unfinished
            //           work on this head, so one may still appear.
            // absent  = no validator check AND nothing left running to produce
            //           one. Only this state is evidence the chain is not wired.
            // running = chain is in flight; the state worth waiting on.
            // settled = chain finished. Any missing manifest now is terminal.
            //
            // Splitting queued from absent is load-bearing, not defensive. A
            // first cut bounded "no check yet" by a 5min grace and called the
            // timeout "not wired". Measured 2026-08-05 on this PR's own first
            // run (actions run 31012338270): the validator check took 241s to
            // appear — it was queued, waiting
            // for a runner — clearing a 300s grace by 59 seconds. Under real
            // concurrency pressure (several lanes competing for the same job
            // pool) that delay routinely exceeds any fixed grace, and the gate
            // would have failed every PR with a confident, wrong diagnosis.
            // Queue latency is not evidence about wiring; the presence of
            // unfinished runs on the head is. Time bounds the deadline only.
            const chainState = async () => {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner, repo: context.repo.repo, ref: headSha, per_page: 100 });
              const mine = runs.filter(r => VALIDATOR_CHECKS.includes(r.name));
              if (mine.length > 0) {
                // settled vs running is exercised by tests/test_verifier_gate_wait.py
                return mine.every(r => r.status === 'completed') ? 'settled' : 'running';
              }
              // No validator check. Is anything still capable of producing one?
              const wf = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: headSha, per_page: 100 });
              // queued-not-absent: tests/test_verifier_gate_wait.py, and the 241s
              // observation dated 2026-08-05 recorded in the block above.
              const live = (wf.data?.workflow_runs || []).some(
                r => r.status === 'queued' || r.status === 'in_progress'
                  || r.status === 'waiting' || r.status === 'pending');
              return live ? 'queued' : 'absent';
            };
            // DEADLINE_MS is derived, not chosen. Measured 2026-08-05 over 26
            // completed validator runs (harness/scripts/verifier_gate_health.py,
            // which re-derives this nightly and fails RED if it stops holding):
            //
            //   queue    p50 251s   p95 320s   max  333s
            //   runtime  p50  38s   p95  75s   max  902s
            //   TOTAL    p50 289s   p95 365s   max 1167s
            //
            // Two corrections to what this file used to assert. It claimed a
            // "15-20min chain"; actual chain runtime is p95 75s. And the wall
            // clock is dominated by QUEUE, not work — the chain spends ~250s
            // waiting for a runner and ~38s reviewing. Anything sized against
            // "how long review takes" was sized against the smaller half.
            //
            // The gate must cover the total, since it starts when the run is
            // created, not when the chain begins. 25min is 4.1x the p95 total
            // and 1.29x the worst observed. Deliberately NOT sized to the 902s
            // runtime outlier: that is a hang against a 75s p95, and a deadline
            // that accommodates hangs never fires, which is the one job it has.
            const DEADLINE_MS = 25 * 60 * 1000;
            // Only reached when NOTHING is queued or running for this head (see
            // chainState) — so this bounds a wiring fault, never queue latency.
            // The first cut used it for queue latency against a 250s median and
            // would have failed ~1 PR in 10 with a wrong diagnosis.
            const GRACE_MS = 5 * 60 * 1000;
            const POLL_MS = 30 * 1000;
            // Drafts: the validator is gated on `draft == false` (ci.yml), so the
            // chain provably never runs and waiting can only ever time out. Fail
            // now with the reason instead of burning the grace window to reach a
            // less accurate message. Still red, still fail-closed — a draft cannot
            // merge, and ready_for_review re-fires this gate with a real verdict.
            if (pr.draft) {
              core.setFailed(
                'Verifier gate: the validator chain does not run on draft PRs, so no verification '
                + 'exists for this head. Mark the PR ready for review to run it.');
              return;
            }
            // A transient API error is not a verdict.
            //
            // Waiting turns ~3 API calls per run into up to ~50 polls, each
            // paginating reviews and check runs, against a GITHUB_TOKEN budget
            // shared with every other workflow firing on every PR in this repo.
            // An unguarded 502 or a 403 from quota exhaustion would throw out of
            // github.paginate and fail the gate red with a stack trace — trading
            // the race for a new and more frequent false red. Transient failures
            // are absorbed as "keep waiting"; the deadline below is what bounds
            // them, so a persistently broken API still terminates, and it
            // terminates as an explicit unverified rather than as a thrown error.
            const settle = async (fn, label, fallback) => {
              try { return await fn(); }
              catch (e) {
                core.info(`Verifier gate: transient ${label} failure (${e.message}); will retry.`);
                return fallback;
              }
            };
            const repoll = async () => {
              await new Promise(r => setTimeout(r, POLL_MS));
              return settle(readFinalReview, 'review-read', undefined);
            };
            const started = Date.now();
            let finalReview = await settle(readFinalReview, 'review-read', undefined);
            while (!finalReview) {
              const state = await settle(chainState, 'check-run-read', 'unknown');
              const waited = Date.now() - started;
              // 'unknown' means we could not observe the chain this cycle. Never
              // resolve on it — fall through to the deadline check and retry.
              if (state === 'unknown') {
                if (waited > DEADLINE_MS) {
                  core.setFailed(
                    `Verifier gate: could not read validator state for ${headSha.slice(0, 8)} within `
                    + `${DEADLINE_MS / 60000}min (persistent API failure). Treat as unverified.`);
                  return;
                }
                finalReview = await repoll();
                continue;
              }
              if (state === 'settled') {
                // tests/test_verifier_gate_wait.py asserts this is reached only
                // after the chain's own check completes, never mid-flight.
                core.setFailed(
                  'Verifier gate: the validator chain completed for this head without posting an '
                  + 'OpenAI final approval manifest. This is a real verification failure, not a race — '
                  + 'read the validator-pipeline logs for the rejecting stage.');
                return;
              }
              // Fail fast ONLY on positive evidence that nothing is coming: no
              // validator check AND no unfinished run left on this head. That is
              // a wiring/naming fault, not a slow queue, so it is safe to name it
              // as one. A short grace still applies because check runs and
              // workflow runs do not appear atomically at the very start.
              if (state === 'absent' && waited > GRACE_MS) {
                core.setFailed(
                  `Verifier gate: no validator check (${VALIDATOR_CHECKS.join(' | ')}) on `
                  + `${headSha.slice(0, 8)}, and no workflow run is still queued or in progress that `
                  + 'could produce one — so verification cannot be established. Check that the '
                  + 'validator workflow is wired in this repository and that its check name is one '
                  + 'of the above.');
                return;
              }
              if (waited > DEADLINE_MS) {
                core.setFailed(
                  `Verifier gate: no final approval manifest after ${DEADLINE_MS / 60000}min with the `
                  + 'validator chain still in flight for this head. Treat as unverified.');
                return;
              }
              core.info(
                `Verifier gate: chain ${state} for ${headSha.slice(0, 8)}, `
                + `${Math.round(waited / 1000)}s elapsed; waiting...`);
              finalReview = await repoll();
            }
            const match = (finalReview.body || '').match(
              /<!-- validator-chain-manifest\s*\n([\s\S]*?)\n-->/
            );
            if (!match) {
              core.setFailed('Verifier gate: OpenAI final review has no parseable chain manifest.');
              return;
            }
            let manifest;
            try { manifest = JSON.parse(match[1]); }
            catch (e) {
              core.setFailed(`Verifier gate: invalid chain manifest JSON (${e.message}).`);
              return;
            }
            const primary = Array.isArray(manifest.primary) ? manifest.primary : [];
            const cross = Array.isArray(manifest.cross) ? manifest.cross : [];
            const sha256 = /^[0-9a-f]{64}$/;
            const providerCount = (name) => primary.filter(
              r => r.provider === name && r.head_sha === headSha
            ).length;
            const providerInstances = (name) => primary.filter(
              r => r.provider === name
            ).reduce(
              (count, r) => count + (Number.isInteger(r.instance_count) ? r.instance_count : 0),
              0
            );
            const skills = (name) => new Set(
              primary.filter(r => r.provider === name).map(r => r.skill)
            );
            const aggregateKeys = new Set(
              primary.map(r => `${r.provider}:${r.skill}`)
            );
            const pairs = new Set(cross.filter(
              r => r.head_sha === headSha && r.validation_complete === true
                && Array.isArray(r.confirmed_blockers) && r.confirmed_blockers.length === 0
            ).map(r => `${r.provider}->${r.validates_provider}`));
            const receipts = [...primary, ...cross].map(r => r.receipt).sort();
            const accepted = Array.isArray(manifest.final?.accepted_receipts)
              ? [...manifest.final.accepted_receipts].sort() : [];
            const aggregateRowsValid = primary.every(r =>
              r.head_sha === headSha
              && Number.isInteger(r.instance_count) && r.instance_count > 0
              && r.receipt === r.receipts_sha256 && sha256.test(r.receipt)
            );
            const aggregateInstances = primary.reduce(
              (count, r) => count + (Number.isInteger(r.instance_count) ? r.instance_count : 0),
              0
            );
            const crossCommitmentsValid = cross.every(r =>
              sha256.test(r.receipt || '')
              && sha256.test(r.validates_receipt || '')
              && sha256.test(r.validation_packets_sha256 || '')
            );
            const coverage = manifest.coverage || {};
            const deterministic = manifest.deterministic_checks || {};
            const forbiddenDeterministicChecks = new Set([
              'validator-pipeline / review', 'verifier-gate', 'key-health'
            ]);
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: headSha,
              per_page: 100
            });
            const deterministicVerified =
              typeof deterministic.name === 'string'
              && deterministic.name.length > 0
              && deterministic.head_sha === headSha
              && deterministic.conclusion === 'success'
              && !forbiddenDeterministicChecks.has(deterministic.name)
              // Current-head status binding is exercised by tests/test_ai_review_reusable_sync.py.
              && checkRuns.some(r =>
                r.name === deterministic.name
                && r.status === 'completed'
                && r.conclusion === 'success'
              );
            // Two accepted specialist shapes during the six-skill rollout
            // (harness/review-skills/): legacy consumers still emit the
            // 2-skill-per-provider manifest; the current chain emits the
            // Codex-validated 3-skill-per-provider set. Each shape is checked
            // strictly — only the shape choice itself is tolerant, so fan-out
            // order (verifier-gate copy vs reusable copy) cannot strand a
            // consumer red.
            const skillShapes = {
              2: {
                deepseek: ['correctness-reliability', 'security-boundaries'],
                kimi: ['tests-operability', 'governance-five-rods'],
              },
              3: {
                deepseek: ['correctness-reliability', 'security-boundaries', 'performance-efficiency'],
                kimi: ['test-adequacy', 'maintainability-contracts', 'governance-five-rods'],
              },
            };
            const skillsPerProvider = providerCount('deepseek');
            const shape = skillShapes[skillsPerProvider];
            const shapeValid = Boolean(shape)
              && ['deepseek', 'kimi'].every(name =>
                shape[name].every(skill => skills(name).has(skill))
              );
            const minSlices = skillsPerProvider === 2 ? 2 : 3;
            // Named checks, not one collapsed boolean. The predicate set and its
            // all-must-hold semantics are unchanged from v2 — only the reporting
            // differs. v2 ANDed these 27 conditions into a single `valid` and
            // failed with one undifferentiated string ("incomplete, stale,
            // unresolved, or not APPROVE"), so diagnosing a red meant fetching the
            // manifest by hand and re-evaluating 27 predicates mentally. Every
            // expression here is pure and null-safe, so losing && short-circuiting
            // costs nothing and buys the full list of what actually failed.
            const checks = [
              ['schema', manifest.schema === 'validator-chain/v1'],
              ['projection', manifest.projection === 'validator-chain/public-commitment/v1'],
              ['manifest.head_sha==head', manifest.head_sha === headSha],
              ['diff_sha256', sha256.test(manifest.diff_sha256 || '')],
              ['full_manifest_sha256', sha256.test(manifest.full_manifest_sha256 || '')],
              // coverage/* mirror the manifest contract in harness/scripts/validator_chain.py
              ['coverage.complete', coverage.reviewed_bytes === coverage.total_bytes],
              ['coverage.nonempty', coverage.total_bytes > 0],
              ['coverage.slice_count', Number.isInteger(coverage.slice_count) && coverage.slice_count >= minSlices],
              ['coverage.slice_budget', Number.isInteger(coverage.slice_budget_chars) && coverage.slice_budget_chars > 0],
              ['primary_calls==2*slices', coverage.primary_calls === coverage.slice_count * 2],
              ['primary_calls==instances', coverage.primary_calls === aggregateInstances],
              ['deepseek.instances', providerInstances('deepseek') === coverage.slice_count],
              ['kimi.instances', providerInstances('kimi') === coverage.slice_count],
              ['deterministic-check', deterministicVerified],
              ['primary.rowcount', primary.length === skillsPerProvider * 2],
              ['primary.keys-distinct', aggregateKeys.size === skillsPerProvider * 2],
              ['primary.rows-well-formed', aggregateRowsValid],
              ['providers-balanced', providerCount('deepseek') === providerCount('kimi')],
              ['skill-shape', shapeValid],
              ['cross.rowcount', cross.length === 2],
              ['cross.commitments', crossCommitmentsValid],
              ['cross:deepseek->kimi', pairs.has('deepseek->kimi')],
              ['cross:kimi->deepseek', pairs.has('kimi->deepseek')],
              ['final.provider', manifest.final?.provider === 'openai'],
              ['final.head_sha', manifest.final?.head_sha === headSha],
              ['final.decision==APPROVE', manifest.final?.decision === 'APPROVE'],
              ['receipts==accepted', JSON.stringify(receipts) === JSON.stringify(accepted)],
            ];
            const failed = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (failed.length) {
              core.setFailed(
                `Verifier gate: staged validator manifest rejected on ${failed.length}/${checks.length} `
                + `checks: ${failed.join(', ')}`);
              return;
            }
            core.info('Verifier gate: DeepSeek/Kimi specialists and reciprocal checks accepted; OpenAI final APPROVE.');
