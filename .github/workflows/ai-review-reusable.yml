                      started,
                      provider=provider,
                      route=route,
                      requested_model=requested_model,
                      status="response_invalid"
                      if _failure_class(exc) == "response_invalid"
                      else "failed",
                      response=response,
                      failure_class=_failure_class(exc),
                      http_status=getattr(exc, "code", http_status),
                  )
