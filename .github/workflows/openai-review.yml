# This repo calls a LOCAL copy of ai-review-reusable.yml, not the shared
# substrate in amplified-fleet-config. The local copy carries its own
# applicability gate: dependency-bot PRs skip the third-party review chain,
# because Dependabot-triggered runs receive Dependabot secrets rather than
# Actions secrets and every reviewer key resolves empty. Deterministic checks
# still govern those PRs. See amplified-fleet-config#334 for the shared fix;
# this copy needs its own because `uses:` points at the local path.
# Signed-by: cascade-mac (Cairn) | 2026-07-23 | ai-review thin caller
# Staged validator chain: parallel DeepSeek/Kimi specialists, reciprocal
# cross-validation, then compact fail-closed OpenAI final approval.
name: validator-pipeline
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: validator-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read
jobs:
  validator-pipeline:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/ai-review-reusable.yml
    with:
      provider: pipeline
    secrets: inherit
