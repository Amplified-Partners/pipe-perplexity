name: verifier-gate
# Amplified principle: verification is third-party — no seat ratifies its own work.
# This gate passes only on a current-head staged manifest: two DeepSeek and two
# Kimi specialist instances, reciprocal cross-validation, then OpenAI APPROVE.
# The implementation is a disposable hypothesis; the principle is the goal.
#
# v2 2026-07-23 | Seat: claude-cowork (Ewan's session) | changes + backing:
#   1. IDENTITY DE-COLLAPSE: Five Rods and the DeepSeek review-only substrate
#      both post via GITHUB_TOKEN as github-actions[bot]; v1 keyed reviewers by
#      login, so two independent substrates counted as ONE reviewer and quorum
#      was unreachable from self-hosted reviewers alone (observed estate-wide
#      2026-07-23, e.g. intent-interface#20). v2 keys github-actions[bot]
#      reviews by their body marker (Five Rods / DeepSeek); unknown bodies
#      still collapse to the bare login, so the split is closed-set.
#   2. CODEX SUMMON REMOVED: chatgpt-codex-connector[bot] is over quota and
#      answers every summon with a usage-limit comment, not a review (observed
#      on 15+ PRs, 2026-07-23). Re-add to SUMMONS when quota is restored.
#   3. LOOP DAMPING: v1 summoned on synchronize; Bugbot Autofix pushes reset
#      the head SHA, invalidating reviews and re-triggering summon -> review ->
#      autofix -> push (loop observed on amplified-fleet-config#160). v2
#      summons only on opened/reopened/ready_for_review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  # merge_group is REQUIRED once verifier-gate is a required status check:
  # the merge queue builds a synthetic merge commit and waits for every
  # required context to report on it. Without this trigger the queue waits
  # forever and silently drops the entry (measured 2026-07-23: #210 and #214
  # queued, estate-gate + vault-ci reported on the merge_group head at 20:53
  # and 21:55, verifier-gate never did, both entries expired).
  merge_group: {}
  # workflow_run closes the re-trigger gap (fr_e605967670a7, measured
  # 2026-08-03 estate-wide): the validator chain posts its reviews with
  # GITHUB_TOKEN, and bot-token events start no workflows, so the
  # pull_request_review trigger above never fires for them — the gate
  # false-failed at ~5s on every armed PR and stayed red until a manual
  # rerun. The validator workflow's own completion is the re-check signal.
  # Both names listed: the vault hosts the chain inside vault-ci; fleet
  # repos host it in a workflow named validator-pipeline. A name that does
  # not exist in a given repo simply never fires.
  workflow_run:
    workflows: [validator-pipeline, vault-ci]  # gap record: fr_e605967670a7, 2026-08-03
    types: [completed]  # per fr_e605967670a7 and docs in this block
permissions:
  pull-requests: read
  checks: read
jobs:
  verifier-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: write
      checks: read
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Merge-queue entries: quorum was already enforced at PR level —
            // a PR cannot ENTER the queue until every required check,
            // verifier-gate included, has succeeded on its head. The merge_group
            // payload carries no pull_request, and reviews cannot bind to the
            // synthetic merge commit, so re-counting here is impossible by
            // construction, not skipped by choice. Pass through; PR-level
            // enforcement is the gate. (Same shape as GitHub's own review
            // requirements, which are PR-level, not merge-commit-level.)
            if (context.eventName === 'merge_group') {
              core.info('merge_group: quorum enforced at PR stage; pass-through.');
              return;
            }
            let pr = context.payload.pull_request;
            if (context.eventName === 'workflow_run') {
              // Bounded workflow_run admission — every outcome on this path
              // either resolves to a full verification below or fails closed.
              // A quiet success return is forbidden here: this job's check
              // run attaches to the triggering run's head SHA, and a
              // success-status check on a PR head would satisfy the required
              // context unverified.
              const wr = context.payload.workflow_run || {};
              const sha40 = /^[0-9a-f]{40}$/;
              const repoFull = `${context.repo.owner}/${context.repo.repo}`;
              if (!sha40.test(wr.head_sha || '')) {
                core.setFailed('Verifier gate: malformed workflow_run payload.');
                return;
              }
              if (wr.conclusion !== 'success') {
                core.setFailed(`Verifier gate: validator workflow concluded ${wr.conclusion || 'unknown'} — no basis to verify.`);
                return;
              }
              if (wr.head_repository?.full_name !== repoFull) {
                core.setFailed('Verifier gate: validator run head is not from this repository.');
                return;
              }
              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100 });
              const found = openPrs.find(p => p.head?.sha === wr.head_sha);
              if (!found) {
                core.setFailed('Verifier gate: no open PR at the validator head — superseded or closed; nothing verifiable.');
                return;
              }
              if (found.head?.repo?.full_name !== repoFull
                  || found.base?.repo?.full_name !== repoFull) {
                core.setFailed('Verifier gate: this path admits same-repo PR heads only.');
                return;
              }
              pr = found;
            }
            if (!pr || !pr.head || !pr.user) {
              core.setFailed(`Verifier gate: unsupported event ${context.eventName} or missing PR payload.`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100 });
            const docsOnly = files.length > 0
              && files.every(f => f.filename.startsWith('docs/') && f.filename.endsWith('.md'));
            const touchesPrePublication = files.some(
              f => f.filename.includes('docs/decided/') || f.filename.includes('pre-publication/')
            );
            if (docsOnly && touchesPrePublication) {
              core.info('pre-publication docs-only change: dispatch scrub forbids outbound validator payloads; pass-through.');
              return;
            }
            const author = pr.user.login;
            // Dependency-bot PRs: quorum is impossible by construction, not
            // skipped by choice. Dependabot-triggered workflows receive
            // Dependabot secrets, not Actions secrets, so every reviewer key
            // resolves empty and no specialist can ever post (measured
            // 2026-07-27 org-wide: "MOONSHOT_API_KEY is not set"). Failing here
            // would report "quorum not met" when the truth is "quorum could not
            // be attempted" — a false signal on a required check. Dependency
            // bumps are governed by the deterministic checks, which run at full
            // force. Narrow by design: the bot login alone takes this path, so
            // no human- or agent-authored PR can. Mirrors the applicability
            // gate in ai-review-reusable.yml; both stop being taken once
            // org-level Dependabot secrets exist.
            if (author === 'dependabot[bot]') {
              core.info(`${author}: reviewer keys unavailable to Dependabot-triggered runs by GitHub design; deterministic checks govern. Pass-through.`);
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number });
            const headSha = pr.head.sha;
            // Review-source key: distinct logins are distinct sources; for
            // github-actions[bot] (shared login for self-hosted reviewers),
            // split by known body markers only (closed set — unknown bodies
            // collapse to the bare login rather than minting new sources).
            const sourceKey = (r) => {
              if (r.user.login !== 'github-actions[bot]') return r.user.login;
              const b = r.body || '';
              if (b.includes('Five Rods Review')) return 'github-actions[bot]:five-rods';
              if (b.includes('DeepSeek independent review')) return 'github-actions[bot]:deepseek';
              if (b.includes('OpenAI independent review')) return 'github-actions[bot]:openai';
              if (b.includes('Codex API independent review')) return 'github-actions[bot]:openai';  // legacy marker, same source
              if (b.includes('Kimi independent review')) return 'github-actions[bot]:kimi';
              if (b.includes('OpenAI final approval')) return 'github-actions[bot]:openai-final';
              return r.user.login;
            };
            const latest = new Map();
            for (const r of reviews) {
              if (!r.user || r.user.login === author) continue;
              if (r.state === 'PENDING') continue;
              if (r.commit_id !== headSha) continue;
              const key = sourceKey(r);
              const prev = latest.get(key);
              if (!prev || new Date(r.submitted_at) > new Date(prev.submitted_at)) latest.set(key, r);
            }
            const active = [...latest.entries()].filter(([, r]) => r.state !== 'DISMISSED');
            const finalReview = active.find(([key]) => key === 'github-actions[bot]:openai-final')?.[1];
            if (!finalReview) {
              core.setFailed('Verifier gate: current-head OpenAI final approval manifest is absent.');
              return;
            }
            const match = (finalReview.body || '').match(
              /<!-- validator-chain-manifest\s*\n([\s\S]*?)\n-->/
            );
            if (!match) {
              core.setFailed('Verifier gate: OpenAI final review has no parseable chain manifest.');
              return;
            }
            let manifest;
            try { manifest = JSON.parse(match[1]); }
            catch (e) {
              core.setFailed(`Verifier gate: invalid chain manifest JSON (${e.message}).`);
              return;
            }
            const primary = Array.isArray(manifest.primary) ? manifest.primary : [];
            const cross = Array.isArray(manifest.cross) ? manifest.cross : [];
            const sha256 = /^[0-9a-f]{64}$/;
            const providerCount = (name) => primary.filter(
              r => r.provider === name && r.head_sha === headSha
            ).length;
            const providerInstances = (name) => primary.filter(
              r => r.provider === name
            ).reduce(
              (count, r) => count + (Number.isInteger(r.instance_count) ? r.instance_count : 0),
              0
            );
            const skills = (name) => new Set(
              primary.filter(r => r.provider === name).map(r => r.skill)
            );
            const aggregateKeys = new Set(
              primary.map(r => `${r.provider}:${r.skill}`)
            );
            const pairs = new Set(cross.filter(
              r => r.head_sha === headSha && r.validation_complete === true
                && Array.isArray(r.confirmed_blockers) && r.confirmed_blockers.length === 0
            ).map(r => `${r.provider}->${r.validates_provider}`));
            const receipts = [...primary, ...cross].map(r => r.receipt).sort();
            const accepted = Array.isArray(manifest.final?.accepted_receipts)
              ? [...manifest.final.accepted_receipts].sort() : [];
            const aggregateRowsValid = primary.every(r =>
              r.head_sha === headSha
              && Number.isInteger(r.instance_count) && r.instance_count > 0
              && r.receipt === r.receipts_sha256 && sha256.test(r.receipt)
            );
            const aggregateInstances = primary.reduce(
              (count, r) => count + (Number.isInteger(r.instance_count) ? r.instance_count : 0),
              0
            );
            const crossCommitmentsValid = cross.every(r =>
              sha256.test(r.receipt || '')
              && sha256.test(r.validates_receipt || '')
              && sha256.test(r.validation_packets_sha256 || '')
            );
            const coverage = manifest.coverage || {};
            const deterministic = manifest.deterministic_checks || {};
            const forbiddenDeterministicChecks = new Set([
              'validator-pipeline / review', 'verifier-gate', 'key-health'
            ]);
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: headSha,
              per_page: 100
            });
            const deterministicVerified =
              typeof deterministic.name === 'string'
              && deterministic.name.length > 0
              && deterministic.head_sha === headSha
              && deterministic.conclusion === 'success'
              && !forbiddenDeterministicChecks.has(deterministic.name)
              // Current-head status binding is exercised by tests/test_ai_review_reusable_sync.py.
              && checkRuns.some(r =>
                r.name === deterministic.name
                && r.status === 'completed'
                && r.conclusion === 'success'
              );
            // Two accepted specialist shapes during the six-skill rollout
            // (harness/review-skills/): legacy consumers still emit the
            // 2-skill-per-provider manifest; the current chain emits the
            // Codex-validated 3-skill-per-provider set. Each shape is checked
            // strictly — only the shape choice itself is tolerant, so fan-out
            // order (verifier-gate copy vs reusable copy) cannot strand a
            // consumer red.
            const skillShapes = {
              2: {
                deepseek: ['correctness-reliability', 'security-boundaries'],
                kimi: ['tests-operability', 'governance-five-rods'],
              },
              3: {
                deepseek: ['correctness-reliability', 'security-boundaries', 'performance-efficiency'],
                kimi: ['test-adequacy', 'maintainability-contracts', 'governance-five-rods'],
              },
            };
            const skillsPerProvider = providerCount('deepseek');
            const shape = skillShapes[skillsPerProvider];
            const shapeValid = Boolean(shape)
              && ['deepseek', 'kimi'].every(name =>
                shape[name].every(skill => skills(name).has(skill))
              );
            const minSlices = skillsPerProvider === 2 ? 2 : 3;
            const valid = manifest.schema === 'validator-chain/v1'
              && manifest.projection === 'validator-chain/public-commitment/v1'
              && manifest.head_sha === headSha
              && sha256.test(manifest.diff_sha256 || '')
              && sha256.test(manifest.full_manifest_sha256 || '')
              && coverage.reviewed_bytes === coverage.total_bytes
              && coverage.total_bytes > 0
              && Number.isInteger(coverage.slice_count) && coverage.slice_count >= minSlices
              && Number.isInteger(coverage.slice_budget_chars) && coverage.slice_budget_chars > 0
              && coverage.primary_calls === coverage.slice_count * 2
              && coverage.primary_calls === aggregateInstances
              && providerInstances('deepseek') === coverage.slice_count
              && providerInstances('kimi') === coverage.slice_count
              && deterministicVerified
              && primary.length === skillsPerProvider * 2
              && aggregateKeys.size === skillsPerProvider * 2
              && aggregateRowsValid
              && providerCount('deepseek') === providerCount('kimi')
              && shapeValid
              && cross.length === 2
              && crossCommitmentsValid
              && pairs.has('deepseek->kimi')
              && pairs.has('kimi->deepseek')
              && manifest.final?.provider === 'openai'
              && manifest.final?.head_sha === headSha
              && manifest.final?.decision === 'APPROVE'
              && JSON.stringify(receipts) === JSON.stringify(accepted);
            if (!valid) {
              core.setFailed('Verifier gate: staged validator manifest is incomplete, stale, unresolved, or not APPROVE.');
              return;
            }
            core.info('Verifier gate: DeepSeek/Kimi specialists and reciprocal checks accepted; OpenAI final APPROVE.');
