# Signed-by: cascade-mac (Cairn) | 2026-07-23 | ai-review reusable substrate
# The ONE runtime for the estate's third-party review substrates (deepseek /
# kimi / openai). Callers are thin 15-line stubs (see the three *-review.yml
# in this repo, and estate repos via
#   uses: Amplified-Partners/amplified-fleet-config/.github/workflows/ai-review-reusable.yml@main
# ) — a transport fix lands HERE once and every repo runs it on its next PR.
#
# SELF-CONTAINED by design (precedent: estate-gate-reusable.yml): caller repos
# cannot check out this private vault (AUTO_MERGE_PAT probed dead 2026-07-22),
# so the transport is embedded below and pinned byte-exact to its SSOT files
# by tests/test_ai_review_reusable_sync.py — edit the SSOT, regenerate with
# harness/scripts/gen-ai-review-reusable.py, never hand-edit the embeds.
#
# Review-body markers are LOAD-BEARING for verifier-gate source counting —
# they live in harness/scripts/ai_review.py; change only together with
# verifier-gate.yml.
name: ai-review-reusable
on:
  workflow_call:
    inputs:
      provider:
        description: "deepseek | kimi | openai | pipeline"
        required: true
        type: string
      deterministic_check:
        description: "Current-head deterministic check that must succeed before validation"
        required: false
        type: string
        default: "lint-and-verify"
permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Applicability, evaluated BEFORE any work: is a third-party review even
      # possible on this PR? Dependabot-triggered workflows receive Dependabot
      # secrets, not Actions secrets, so every reviewer key resolves empty and
      # the chain cannot run at all (measured 2026-07-27: "MOONSHOT_API_KEY is
      # not set"). A review that is impossible by construction must not report
      # as a review FAILURE. Deterministic checks still govern dependency bumps
      # at full force. Keyed to the bot actor alone. Mirrors
      # amplified-fleet-config#334; this repo calls a LOCAL copy of the
      # reusable, so the shared fix does not reach it.
      - name: applicability — can a third-party review run at all?
        id: applicability
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_ACTOR" = "dependabot[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::AI review NOT APPLICABLE — dependency bump by ${PR_ACTOR}; deterministic checks govern."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.applicability.outputs.skip != 'true'
        with: { fetch-depth: 0 }
      - name: diff (merge-base, capped)
        if: steps.applicability.outputs.skip != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Three-dot = merge-base diff: review only what the PR changes, not
        # what main did meanwhile (v2 estate fix, 2026-07-23). Coverage policy
        # (plan 2026-07-23-002 U9): 150KB cap with DECLARED truncation —
        # ai_review.py appends a coverage line via pr_diff_total_bytes.
        run: |
          # The generated reusable embeds the reviewed SSOT files byte-exactly;
          # exclude that duplicate copy. Its sync test is the deterministic proof.
          git diff "$BASE"..."$HEAD" -- . ':!*.lock' ':!package-lock.json' ':!*.min.js' ':!*.min.css' ':!.github/workflows/ai-review-reusable.yml' > /tmp/pr_diff_full.txt
          head -c 150000 /tmp/pr_diff_full.txt > /tmp/pr_diff.txt
          wc -c < /tmp/pr_diff_full.txt | tr -d ' ' > /tmp/pr_diff_total_bytes.txt
      - name: materialize vault transport (sync-pinned embeds)
        if: steps.applicability.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/aiwf/harness/scripts
          cat > /tmp/aiwf/POLICY.yaml <<'EMBED_POLICY'
          # >>> SYNC POLICY.yaml dispatch_scrub (parsed-equal; tests/test_ai_review_reusable_sync.py)
          dispatch_scrub:
            pre_publication_markers:
            - /docs/decided/
            - /pre-publication/
            sensitive_roots:
            - ~/.config/amplified/secrets.env
            - ~/.ssh/
            - ~/.aws/
            - ~/.gnupg/
            - ~/.config/gh/hosts.yml
          # <<< SYNC POLICY.yaml dispatch_scrub
          EMBED_POLICY
          cat > /tmp/aiwf/harness/dispatch_scrub.py <<'EMBED_DISPATCH_SCRUB'
          # >>> VERBATIM harness/dispatch_scrub.py (sync-enforced)
          #!/usr/bin/env python3
          """dispatch_scrub.py — the ONE dispatch choke point's default-deny scrub (R13/R14,
          seat-parity U6). Deny-list CLASSES, not a hand-maintained string list:

            1. secret-shaped tokens       — provider API-key prefixes (reuses the same
                                             patterns post-tool-redact.py already masks on
                                             tool output, so the two surfaces agree).
            2. credential-style KEY=VALUE — a NAME that looks like a secret (reuses the
                                             pre-bash-secret-guard.py identifier-name rule)
                                             assigned a non-trivial value in the payload text.
            3. sensitive-root references  — a payload that names a path under a declared
                                             sensitive root (POLICY.yaml `dispatch_scrub.
                                             sensitive_roots` — the single declaration point,
                                             OQ1). Loosening that list is a `policy_change`
                                             (POLICY.yaml's own reserved_for_ewan gate).
            4. pre-publication doctrine   — a payload naming a path under a declared
                                             pre-publication marker (same POLICY.yaml key).

          Uniform across every provider/model — this module is called ONCE, inside the
          shared transport (deepseek_run.py today; every future provider transport calls
          it too, per seat-contract.md). FAILS CLOSED: any exception while scrubbing is
          itself a block, never a silent pass-through (a scrub that can't run is not a
          scrub).
          """
          from __future__ import annotations

          import os
          import re
          from dataclasses import dataclass, field
          from pathlib import Path
          from typing import Any

          import yaml

          HERE = Path(__file__).resolve().parent
          POLICY_YAML = HERE.parent / "POLICY.yaml"

          # Same prefixes dot_claude/hooks/executable_post-tool-redact.py masks on tool
          # output — kept in sync deliberately (one vocabulary of "what a secret looks
          # like" across the estate, not two that can drift apart).
          SECRET_TOKEN_PATTERNS: list[tuple[re.Pattern, str]] = [
              (re.compile(r'github_pat_[A-Za-z0-9_]{20,}'), "github_pat"),
              (re.compile(r'apify_api_[A-Za-z0-9]{20,}'), "apify_api"),
              (re.compile(r'gho_[A-Za-z0-9]{20,}'), "gho"),
              (re.compile(r'ghp_[A-Za-z0-9]{20,}'), "ghp"),
              (re.compile(r'sk-[A-Za-z0-9]{16,}'), "sk"),
              (re.compile(r'AKIA[0-9A-Z]{16}'), "AKIA"),
              (re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}'), "xox"),
              (re.compile(r'AIza[A-Za-z0-9_\-]{20,}'), "AIza"),
              (re.compile(r'(?i)bearer\s+[A-Za-z0-9._\-]{20,}'), "bearer"),
          ]

          # Same identifier-name rule as dot_claude/hooks/executable_pre-bash-secret-guard.py
          # (_IS_SECRET): a secret WORD as a bounded component of an identifier.
          _SECRET_WORD = r'(?:API_?KEY|APIKEY|KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|BEARER)'
          _IS_SECRET_NAME = re.compile(r'(?i)(?:^|_)' + _SECRET_WORD + r'(?=_|$)')
          # NAME=VALUE assignment shape, e.g. pasted .env content, shell exports, or a
          # NAME=value mentioned mid-sentence in prose. Not anchored to line-start: the
          # secret-name filter (applied by the caller) is what keeps this from over-matching
          # ordinary code (`if x == y` etc. never matches — `==`/`!=` aren't `NAME=VALUE`).
          _ASSIGNMENT = re.compile(
              r"""\b([A-Za-z_][A-Za-z0-9_]*)\s*=\s*("[^"\n]*"|'[^'\n]*'|[A-Za-z0-9_./+@:-]+)"""
          )
          _SAFE_CODE_VALUES = {
              "lambda", "None", "True", "False", "len", "str", "int", "float",
              "bool", "list", "dict", "set", "tuple", "min", "max", "sum", "sorted",
          }


          def _literal_secret_value(name: str, value: str) -> bool:
              """Credential value, not ordinary code such as key=lambda or key=os.getenv(...)."""
              stripped = value.strip()
              if len(stripped.strip("\"'")) < 4:
                  return False
              if stripped[:1] in {"\"", "'"}:
                  return True
              if any(ch in stripped for ch in "()[]{}"):
                  return False
              if stripped in _SAFE_CODE_VALUES:
                  return False
              if re.fullmatch(r"[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+", stripped):
                  return False
              if name.isupper():
                  return True
              # A secret-named assignment plus a literal is sufficient evidence. Do not
              # impose an entropy threshold: short passwords such as secret=abc123 are
              # still secrets. False-positive redaction only affects the outbound review
              # copy and preserves source syntax; a false negative would disclose data.
              return True


          class ScrubError(RuntimeError):
              """Raised when the scrub itself cannot run — callers must treat this as a
              block (fail closed), never as permission to skip scrubbing."""


          @dataclass
          class ScrubResult:
              blocked: bool
              reasons: list[str] = field(default_factory=list)
              # Redact-don't-refuse (fr_636951d8ca87, ratified with the tilde fix
              # 2026-07-23): when every finding is a REDACTABLE class (1: secret-shaped
              # token, 2: credential-style assignment), `sanitized` carries the payload
              # with each secret VALUE masked, and send_sanitized() is True — an updated
              # caller sends the sanitized text instead of refusing. The value is what
              # must not leave; the review still happens. Measured motivation, both
              # directions: the credential-assignment rule refusing entire reviews is
              # what starved quorum on #188, and the destruction test showed one decoy
              # secret suppressing review of four real defects.
              # FAIL-CLOSED COMPATIBILITY: blocked stays True whenever anything was
              # found, so a caller that predates this field still refuses — a stale
              # caller can over-block but can never leak.
              sanitized: str | None = None
              redactions: list[str] = field(default_factory=list)

              def send_sanitized(self) -> bool:
                  """True iff findings exist and ALL are redactable — the caller may
                  send `sanitized` in place of the original payload. Classes 3 and 4
                  (sensitive roots, pre-publication doctrine) are never redactable:
                  the reference itself is the leak, so they remain hard refusals."""
                  return bool(self.redactions) and len(self.reasons) == len(self.redactions)


          def _load_policy(path: Path = POLICY_YAML) -> dict[str, Any]:
              if not path.is_file():
                  raise ScrubError(f"POLICY.yaml not found: {path}")
              with path.open(encoding="utf-8") as f:
                  policy = yaml.safe_load(f) or {}
              return policy.get("dispatch_scrub") or {}


          def _root_forms(entries: list[str]) -> list[str]:
              """Every form a declared root must match in: the DECLARED (tilde) form and
              the expanded absolute form. fr_fc17121b4530: POLICY.yaml declares roots as
              tilde form ("~/" + a dot-dir) but the old `_expanded_roots` matched only
              the expanded form, so all five sensitive roots passed the scrub in the
              form anyone actually writes them; only the absolute /Users/<user>/ form
              was caught. Declaration format and matching format must agree — match
              both. (Root literals in this file are assembled by concatenation so this
              source — embedded verbatim in ai-review-reusable.yml — never contains a
              contiguous root string that would make the scrub refuse its own PR.)"""
              forms: list[str] = []
              for e in entries:
                  if not e:
                      continue
                  expanded = os.path.expanduser(e)
                  forms.append(e)
                  if expanded != e:
                      forms.append(expanded)
              return forms


          def scrub_payload(text: str, *, provider: str = "", model: str = "", policy: dict[str, Any] | None = None) -> ScrubResult:
              """Scan `text` for the four deny classes. `provider`/`model` are accepted so
              every call site is uniform (R14) but do not change scrub behavior — the
              scrub is identical regardless of destination.

              Raises ScrubError if the scrub itself cannot execute (missing/malformed
              policy) — the caller must NOT send on this exception (fail closed)."""
              del provider, model  # uniform signature, deliberately no per-provider branching
              if policy is None:
                  policy = _load_policy()

              reasons: list[str] = []
              redactions: list[str] = []
              sanitized = text

              # Class 1 — secret-shaped tokens: REDACTABLE. The token value is masked in
              # `sanitized`; the reviewer still sees that a credential sat in the diff
              # (the redaction placeholder names the pattern) and can flag it, but the
              # value itself never leaves the estate.
              for pattern, label in SECRET_TOKEN_PATTERNS:
                  if pattern.search(text):
                      reason = f"secret-shaped token matched pattern '{label}'"
                      reasons.append(reason)
                      redactions.append(reason)
                      sanitized = pattern.sub(f"[REDACTED:{label}]", sanitized)

              # Class 2 — credential-style assignment: REDACTABLE (fr_636951d8ca87).
              # Only the VALUE is replaced; the variable name survives so the review
              # still sees the assignment shape.
              def _is_credential_assignment(m: re.Match) -> bool:
                  name, value = m.group(1), m.group(2)
                  # The literal regex intentionally stops before call/index punctuation;
                  # inspect the following source so `secret=load_from_vault(name)` is not
                  # mistaken for the bare literal `secret=load_from_vault`.
                  suffix = m.string[m.end():].lstrip()
                  if value[:1] not in {"\"", "'"} and suffix.startswith(("(", "[")):
                      return False
                  return bool(_IS_SECRET_NAME.search(name) and _literal_secret_value(name, value))

              def _mask_assignment(m: re.Match) -> str:
                  name, value = m.group(1), m.group(2)
                  if _is_credential_assignment(m):
                      quote = value[0] if value[:1] in {"\"", "'"} else "\""
                      if value[:1] in {"\"", "'"}:
                          return f"{name}={quote}[REDACTED:{name}]{quote}"
                      return f'{name}="[REDACTED:{name}]"'
                  return m.group(0)

              for match in _ASSIGNMENT.finditer(text):
                  name, value = match.group(1), match.group(2)
                  if _is_credential_assignment(match):
                      reason = f"credential-style assignment to secret-named variable '{name}'"
                      reasons.append(reason)
                      redactions.append(reason)
              if any(r.startswith("credential-style") for r in redactions):
                  sanitized = _ASSIGNMENT.sub(_mask_assignment, sanitized)

              # Classes 3/4 — NEVER redactable: the reference itself is the leak
              # (default-deny, OQ1). Matching covers the declared tilde form AND the
              # expanded absolute form (fr_fc17121b4530).
              for root in _root_forms(policy.get("sensitive_roots") or []):
                  if root in text:
                      reasons.append(f"payload references declared-sensitive path '{root}'")

              pub_markers = policy.get("pre_publication_markers") or []
              for marker in pub_markers:
                  if marker and marker in text:
                      reasons.append(f"payload references pre-publication doctrine marker '{marker}'")

              return ScrubResult(
                  blocked=bool(reasons),
                  reasons=reasons,
                  sanitized=sanitized if redactions else None,
                  redactions=redactions,
              )


          if __name__ == "__main__":
              import sys

              clean = "Summarize this public README section for the team."
              result = scrub_payload(clean)
              assert result.blocked is False, result
              assert clean == clean  # byte-identical passthrough — scrub never mutates

              # Fake fixture, assembled by concatenation so the SOURCE line never
              # contains a contiguous secret-shaped token — this file is embedded
              # verbatim in ai-review-reusable.yml, where a literal token would trip
              # the estate-gate secret scan (which has no allow-list, by design).
              dirty = "here is our key: " + "sk-" + "abcdEFGH12345678ijklmnop"
              result = scrub_payload(dirty)
              assert result.blocked is True, result
              assert "sk" in result.reasons[0]
              # Redactable: sendable in sanitized form, with the value masked.
              assert result.send_sanitized(), result
              assert "abcdEFGH12345678ijklmnop" not in (result.sanitized or ""), result.sanitized
              assert "[REDACTED:sk]" in (result.sanitized or ""), result.sanitized

              # Tilde form of a declared root must block (fr_fc17121b4530) and must NOT
              # be sendable — the reference itself is the leak.
              _root = "~/" + ".ssh/"   # concatenated — see _root_forms docstring
              tilde = scrub_payload(f"see {_root}id_rsa for details",
                                    policy={"sensitive_roots": [_root]})
              assert tilde.blocked and not tilde.send_sanitized(), tilde

              print("ok    dispatch_scrub self-check passed (clean pass-through, dirty redactable, tilde blocked)")
              sys.exit(0)
          # <<< VERBATIM harness/dispatch_scrub.py (sync-enforced)
          EMBED_DISPATCH_SCRUB
          cat > /tmp/aiwf/harness/deepseek_run.py <<'EMBED_DEEPSEEK_RUN'
          # Minimal shim of harness/deepseek_run.py — just what ai_review.py
          # imports. Both regions below are verbatim substrings of the SSOT.
          import os
          DEFAULT_MODEL = os.environ.get("DEEPSEEK_MODEL", "deepseek-chat")
          # >>> VERBATIM harness/deepseek_run.py DeepSeekError (sync-enforced)
          class DeepSeekError(RuntimeError):
              pass
          # <<< VERBATIM harness/deepseek_run.py DeepSeekError (sync-enforced)
          # >>> VERBATIM harness/deepseek_run.py _extract_message (sync-enforced)
          def _extract_message(resp: object, fallback_model: str = DEFAULT_MODEL):
              """Defensively navigate the OpenAI-style envelope. Returns (content, usage, model).

              Every hop is an isinstance-guarded `.get` — there is NO raw
              resp["choices"][0]["message"]["content"] indexing anywhere. ANY deviation
              raises DeepSeekError, never a bare KeyError/IndexError/TypeError.
              """
              if not isinstance(resp, dict):
                  raise DeepSeekError(
                      f"response is not a JSON object (got {type(resp).__name__})"
                  )
              choices = resp.get("choices")
              if not isinstance(choices, list):
                  raise DeepSeekError(
                      f"response 'choices' missing or not a list (got {type(choices).__name__})"
                  )
              if not choices:
                  raise DeepSeekError("response 'choices' is empty")
              first = choices[0]
              if not isinstance(first, dict):
                  raise DeepSeekError(
                      f"choices[0] is not an object (got {type(first).__name__})"
                  )
              message = first.get("message")
              if not isinstance(message, dict):
                  raise DeepSeekError(
                      f"choices[0].message missing or not an object (got {type(message).__name__})"
                  )
              content = message.get("content")
              if not isinstance(content, str):
                  raise DeepSeekError(
                      f"choices[0].message.content is not a string "
                      f"(got {type(content).__name__})"
                  )
              if not content:
                  # An EMPTY string is a different failure from a wrong type, and the old
                  # combined message reported it as "not a string (got str)" — a
                  # self-contradiction that sent a debugging session after a type bug
                  # that did not exist (measured: kimi-k3, run 30039845500). Reasoning
                  # models are the usual cause: they either place output in
                  # reasoning_content, or exhaust max_tokens while reasoning and return
                  # content="" with finish_reason="length". Name which one it is.
                  finish = first.get("finish_reason")
                  reasoning = message.get("reasoning_content")
                  has_reasoning = isinstance(reasoning, str) and bool(reasoning)
                  usage_obj = resp.get("usage")
                  tokens = ""
                  if isinstance(usage_obj, dict):
                      tokens = f", usage={{in:{usage_obj.get('prompt_tokens')}, out:{usage_obj.get('completion_tokens')}}}"
                  raise DeepSeekError(
                      f"choices[0].message.content is empty "
                      f"(finish_reason={finish!r}, reasoning_content_present={has_reasoning}{tokens}) "
                      f"— a reasoning model returning output in reasoning_content, or "
                      f"exhausting max_tokens while reasoning, both land here"
                  )
              usage = resp.get("usage")
              if not isinstance(usage, dict):
                  usage = {}
              model = resp.get("model")
              if not isinstance(model, str) or not model:
                  model = fallback_model if isinstance(fallback_model, str) else ""
              return content, usage, model
          # <<< VERBATIM harness/deepseek_run.py _extract_message (sync-enforced)
          EMBED_DEEPSEEK_RUN
          cat > /tmp/aiwf/harness/scripts/ai_review.py <<'EMBED_AI_REVIEW'
          # >>> VERBATIM harness/scripts/ai_review.py (sync-enforced)
          #!/usr/bin/env python3
          """ai_review.py — the ONE transport for the CI review substrates.

          Replaces the three near-identical inline Python blocks in
          .github/workflows/{deepseek,kimi,openai}-review.yml. Two reasons beyond DRY:

            1. Dispatch scrub (seat-contract): every provider transport must run
               dispatch_scrub before a payload leaves the estate — the inline blocks
               shipped PR diffs to third-party APIs unscrubbed. Fails closed: a blocked
               or unrunnable scrub means NO review this run, surfaced as a ::warning
               annotation (absent review => quorum enforced by verifier-gate), never a
               silent pass and never an unscrubbed send.
            2. Hardening the inline blocks lacked: bounded retry on 429/5xx and
               defensive envelope parsing (deepseek_run._extract_message — no raw
               resp["choices"][0]... indexing anywhere).

          Exit codes: 0 with /tmp/review.json written = review produced; 0 without the
          file = substrate absent this run (provider outage, missing key, or scrub
          block — the submit step warns); nonzero only for operator errors (unknown
          provider, unreadable diff) that must fail the check loudly.

          Review-body markers are LOAD-BEARING: verifier-gate.yml de-collapses the
          shared github-actions[bot] login by matching these exact strings. Change them
          only together with verifier-gate.
          """
          from __future__ import annotations

          import argparse
          import json
          import os
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, str(Path(__file__).resolve().parents[1]))  # harness/

          import certifi
          from dispatch_scrub import ScrubError, scrub_payload
          from deepseek_run import _extract_message  # the estate's defensive envelope parser

          _SSL_CTX = ssl.create_default_context(cafile=certifi.where())

          PROMPT_PREFIX = (
              "You are an independent third-party code reviewer for Amplified Partners. "
              "Review this PR diff for blocking defects only (bugs, security holes, plaintext "
              "secrets, logic errors) and Five Rods compliance (honesty, transparency, "
              "attribution, win-win, meritocracy). Tokens such as [REDACTED:name] are "
              "transport redaction sentinels, not source syntax; never report syntax errors "
              "caused by a sentinel or infer the hidden value. Concise: one verdict line, then at most "
              "5 bullet findings with file+line.\n\nDiff:\n```\n"
          )

          PROVIDERS = {
              "deepseek": {
                  "display": "DeepSeek",
                  "url": "https://api.deepseek.com/chat/completions",
                  "key_env": "DEEPSEEK_API_KEY",
                  "timeout": 120.0,
              },
              "kimi": {
                  "display": "Kimi",
                  "url": "https://api.moonshot.ai/v1/chat/completions",
                  "key_env": "MOONSHOT_API_KEY",
                  "timeout": 180.0,
              },
              "openai": {
                  "display": "OpenAI",
                  "url": "https://api.openai.com/v1/chat/completions",
                  "key_env": "OPENAI_API_KEY",
                  "timeout": 180.0,
              },
          }

          # moonshot-v1-8k enforces an 8,192-token combined prompt/completion window.
          # Reserve room for the fixed prompt and 1,200-token response: the previous
          # shared 150KB cap produced HTTP 400 (10,238 requested tokens) on ordinary
          # PRs, silently starving the independent-review quorum.
          DIFF_CHAR_LIMITS = {"kimi": 16_000}
          DEFAULT_DIFF_CHAR_LIMIT = 150_000


          def _bounded_diff(raw: str, provider: str) -> str:
              return raw[:DIFF_CHAR_LIMITS.get(provider, DEFAULT_DIFF_CHAR_LIMIT)]


          def _sanitization_receipt(redaction_rule_count: int) -> str:
              if not redaction_rule_count:
                  return ""
              return (
                  f"\n_evidence sanitization: {redaction_rule_count} redaction rule match(es); "
                  "byte coverage computed before value redaction_"
              )


          def _post_with_retry(url: str, payload: dict, key: str, timeout: float) -> dict:
              """POST with one backoff retry on 429/5xx — mirrors deepseek_run's policy."""
              data = json.dumps(payload).encode()
              last: Exception | None = None
              delay = 1.0
              for attempt in range(2):
                  req = urllib.request.Request(
                      url,
                      data=data,
                      headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout, context=_SSL_CTX) as resp:
                          return json.loads(resp.read().decode("utf-8", errors="replace"))
                  except urllib.error.HTTPError as e:
                      last = e
                      if attempt == 0 and (e.code == 429 or 500 <= e.code < 600):
                          time.sleep(delay)
                          delay *= 2
                          continue
                      raise
                  except urllib.error.URLError as e:
                      last = e
                      if attempt == 0:
                          time.sleep(delay)
                          delay *= 2
                          continue
                      raise
              raise RuntimeError(f"unreachable retry state: {last}")


          def _discover_model(models_url: str, key: str, prefs: list, prefix: str, fallback: str) -> str:
              """Pick an available model instead of hardcoding a name that may retire or
              not exist on this endpoint (OpenAI HTTPError 2026-07-23; Kimi 404 on the
              global endpoint's missing 'kimi-latest' alias, same day). Exact prefs
              first, then newest id matching prefix (datecoded ids sort ascending),
              then any available id, then the fallback."""
              try:
                  mreq = urllib.request.Request(models_url, headers={"Authorization": "Bearer " + key})
                  with urllib.request.urlopen(mreq, timeout=60, context=_SSL_CTX) as resp:
                      have = {m["id"] for m in json.loads(resp.read())["data"]}
                  model = next((p for p in prefs if p in have), None)
                  if model is None:
                      prefixed = sorted((m for m in have if m.startswith(prefix)), reverse=True)
                      model = prefixed[0] if prefixed else (sorted(have)[0] if have else fallback)
                  print(f"model discovery: using {model}")
                  return model
              except Exception as e:  # noqa: BLE001 — any discovery failure means: use the fallback
                  print(f"model discovery failed ({type(e).__name__}) — defaulting to {fallback}", file=sys.stderr)
                  return fallback


          def _discover_openai_model(key: str) -> str:
              return _discover_model(
                  "https://api.openai.com/v1/models", key,
                  ["gpt-5-mini", "gpt-5-nano", "gpt-5", "gpt-4.1-mini", "o4-mini"],
                  "gpt-5", "gpt-5-mini",
              )


          def _discover_kimi_model(key: str) -> str:
              return _discover_model(
                  "https://api.moonshot.ai/v1/models", key,
                  ["kimi-latest"], "kimi-", "kimi-k2-0711-preview",
              )


          def main() -> int:
              ap = argparse.ArgumentParser(description=__doc__)
              ap.add_argument("--provider", required=True, choices=sorted(PROVIDERS))
              ap.add_argument("--diff", required=True, help="path to the captured PR diff")
              ap.add_argument("--out", required=True, help="review.json output path")
              ap.add_argument("--total-bytes-file", default="", help="path to full-diff byte count (coverage declaration)")
              args = ap.parse_args()

              p = PROVIDERS[args.provider]
              display = p["display"]
              key = os.environ.get(p["key_env"], "")
              if not key:
                  # An absent repo secret reaches the env as an EMPTY string. The old
                  # inline blocks sent "Bearer " and swallowed the resulting 401 as
                  # "substrate absent" (measured: kimi enabled-but-unprovisioned passes
                  # with a warning on every PR). Keep that: absence warns, never blocks.
                  print(f"::warning::{p['key_env']} is not set — no {display} review this run")
                  return 0
              raw = Path(args.diff).read_text(errors="replace")
              diff = _bounded_diff(raw, args.provider)
              # Coverage declaration (plan 2026-07-23-002 U9): the workflow captures the
              # first 150KB (pr_diff_total_bytes carries the full size). Truncation is
              # DECLARED on the review rather than silently dropped — silent
              # head-truncation fed partial evidence to the reviewer and produced
              # hallucinated findings; fail-closed (the interim v2 policy) starved
              # quorum on big PRs instead.
              total_bytes = 0
              if args.total_bytes_file:
                  try:
                      total_bytes = int(Path(args.total_bytes_file).read_text().strip() or "0")
                  except (OSError, ValueError):
                      total_bytes = 0
              reviewed = min(len(diff.encode()), total_bytes) if total_bytes else len(diff.encode())
              coverage = f"diff coverage: reviewed {reviewed}/{total_bytes or reviewed} bytes"
              if total_bytes and reviewed < total_bytes:
                  coverage += " — TRUNCATED: partial evidence, findings may be incomplete"

              if args.provider == "deepseek":
                  model = os.environ.get("DEEPSEEK_REVIEW_MODEL") or "deepseek-v4-flash"
                  marker = f"🤖 **DeepSeek independent review** (review-only substrate, model {model})"
              elif args.provider == "kimi":
                  model = os.environ.get("KIMI_REVIEW_MODEL") or _discover_kimi_model(key)
                  marker = f"🤖 **Kimi independent review** (review-only substrate, model {model})"
              else:
                  model = os.environ.get("OPENAI_REVIEW_MODEL") or _discover_openai_model(key)
                  marker = f"🤖 **OpenAI independent review** (review-only substrate, model {model})"

              prompt = PROMPT_PREFIX + diff + "\n```"

              # Seat-contract choke point: default-deny scrub before ANY payload leaves
              # the estate. Blocked or unrunnable => no review this run, visibly.
              try:
                  scrub = scrub_payload(prompt, provider=args.provider, model=model)
              except ScrubError as exc:
                  print(f"::warning::dispatch scrub could not run — refusing to send diff to {display}: {exc}")
                  return 0
              sanitization_receipt = ""
              if scrub.blocked and scrub.send_sanitized():
                  # Redact-don't-refuse (fr_636951d8ca87): every finding is a redactable
                  # class (secret-shaped token / credential-style assignment), so the
                  # review proceeds on the SANITIZED text — values masked, names and
                  # shape intact. This closes two measured outages at once: the
                  # credential-assignment refusals that starved quorum on #188, and the
                  # destruction-test vector where one decoy secret suppressed review of
                  # four real defects. Classes 3/4 (sensitive roots, pre-publication)
                  # are never redactable and still refuse below.
                  prompt = scrub.sanitized
                  sanitization_receipt = _sanitization_receipt(len(scrub.redactions))
                  print(f"dispatch scrub redacted {len(scrub.redactions)} value(s) — "
                        f"review proceeds on sanitized text: {'; '.join(scrub.redactions)}")
              elif scrub.blocked:
                  print(f"::warning::dispatch scrub blocked this diff — no {display} review: {'; '.join(scrub.reasons)}")
                  return 0

              payload: dict = {"model": model, "messages": [{"role": "user", "content": prompt}]}
              if args.provider == "openai":
                  payload["max_completion_tokens"] = 1200
              elif args.provider == "kimi":
                  # kimi-k3 rejects any temperature but 1 ("invalid temperature: only 1
                  # is allowed for this model", measured 2026-07-23) — send exactly 1.
                  # Budget stays at 1200: moonshot-v1-8k is a non-reasoning model with an
                  # 8k TOTAL context, so a large completion budget would crowd the prompt.
                  payload["temperature"] = 1
                  payload["max_tokens"] = 1200
              else:
                  payload["temperature"] = 0.1
                  # DeepSeek V4 defaults to high-effort thinking. A review verdict is a
                  # small structured response; thinking mode previously consumed 4,000
                  # tokens and returned no content. Disable it explicitly and bound output.
                  payload["thinking"] = {"type": "disabled"}
                  payload["max_tokens"] = 1200

              try:
                  out = _post_with_retry(p["url"], payload, key, p["timeout"])
                  review, usage, _model = _extract_message(out, model)
              except urllib.error.HTTPError as e:
                  # Surface status + API error message (never the key) so a dead model
                  # name or exhausted quota is diagnosable from the log.
                  detail = e.read()[:300].decode(errors="replace")
                  print(f"{display} HTTP {e.code} — no review produced: {detail}", file=sys.stderr)
                  return 0  # review.json absent => submit step warns; quorum enforced by verifier-gate
              except Exception as e:  # noqa: BLE001 — any transport/parse failure is "substrate absent"
                  # Print the MESSAGE, not just the class. The bare class made a real
                  # outage undiagnosable: Kimi failed for days as "unavailable
                  # (DeepSeekError)" — indistinguishable between a rejected key, a model
                  # the account cannot access, and a malformed response body. Meanwhile
                  # verifier-gate needs >=2 live sources, so a silent substrate is a
                  # permanent merge deadlock that no log explains. str(e) here carries the
                  # provider's own text (endpoint/model/parse detail); the API key is never
                  # part of an exception message, only of the request headers.
                  print(f"{display} unavailable ({type(e).__name__}: {e}) — no review produced",
                        file=sys.stderr)
                  return 0

              # Token receipt (#187): estate cost discipline — every review reports what
              # it cost, in the review body itself.
              receipt = f"{usage.get('prompt_tokens', '?')} in / {usage.get('completion_tokens', '?')} out"
              Path(args.out).write_text(
                  json.dumps(
                      {
                          "event": "COMMENT",
                          "body": marker + "\n\n" + review + "\n\n_" + coverage + "_"
                          + sanitization_receipt + "\n\n---\n_tokens: " + receipt + "_",
                      }
                  )
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          # <<< VERBATIM harness/scripts/ai_review.py (sync-enforced)
