              contract = (
                  "Cross-validate another provider family's specialist evidence. You may not "
                  "validate your own provider. Return ONLY JSON with keys validation_complete "
                  "(boolean) and confirmed_blockers (array of concise claims). Check each "
                  "rejection against its source slice. Unsupported findings are cleared, not "
                  "confirmed (contract: tests/test_validator_chain.py). A successful named "
                  "authoritative deterministic check clears claims "
                  "(contract: tests/test_validator_chain.py) "
                  "of syntax errors, broken tests, or impossible runtime behavior unless the "
                  "finding proves that check does not cover the cited path. Reject claims about "
                  "truncated excerpt boundaries, transport redaction sentinels, or a file "
                  "merely being new. A removed '-' line or a deleted file cannot prove current-"
                  "head exposure or behavior; clear findings whose evidence exists only in "
                  "deleted content. Comments do not override executable final-state behavior; "
                  "clear a stale-comment objection when the shown active logic contradicts it. "
                  "The exact Amplified-Partners/amplified-fleet-config/.github/workflows/"
                  "ai-review-reusable.yml@main reference is the authorized governed estate "
                  "contract; clear generic untrusted/unpinned supply-chain objections to it. "
                  "Clear any claim that an unchanged dependency is missing "
                  "only because it is absent from the diff slice. For a source slice marked "
                  "changed_file_complete=false, clear claims that a symbol, branch, check, "
                  "field, or function is unused, absent, unreachable, or unenforced unless "
                  "the shown lines independently prove it without omitted context. Clear "
                  "objections to the "
                  "mandated all-three-stage, fail-closed architecture: policy strictness is not "
                  "a code defect. The scrub mutates only the outbound copy, so confirm it only "
                  "for a proved leak or source mutation. A generic compromised-token scenario "
                  "is not an exploit path; the source-key code assigns body markers only after "
                  "verifying the author is github-actions[bot].\n"
              )
              # Each rejection is checked in its own bounded dossier. The old single
              # dossier grew with every slice and exceeded Kimi's 8k route before any
              # fallback could run. APPROVE rows need only the aggregate commitment.
              batches = rejected or [None]
              packet_digests = []
              usages = []
              actual_models = set()
              all_validations_complete = True
              blockers: list[str] = []
              for rejection in batches:
                  packet = {
                      "head_sha": head,
                      "peer_provider": peer,
                      "peer_summary": summary,
                      "deterministic_checks": deterministic,
                      "rejection": None,
                      "review_contract": {
                          "diff_is_not_repository_inventory": True,
                          "deterministic_check_passed": deterministic.get("conclusion")
                          == "success",
                          "all_three_stages_required": True,
                          "fail_closed_on_provider_outage": True,
                          "scrub_mutates_outbound_copy_only": True,
                          "non_bot_body_markers_cannot_mint_bot_source": True,
                      },
                  }
                  if rejection is not None:
                      compact_findings = [
                          {
                              key: str(finding.get(key, ""))[:320]
                              for key in ("severity", "file", "line", "claim", "evidence")
                          }
                          for finding in rejection["findings"]
                      ]
                      packet["rejection"] = {
                          "receipt": rejection["receipt"],
                          "slice_index": rejection["slice_index"],
                          "findings": compact_findings,
                          "source_slice": _evidence_excerpt(
                              slices[rejection["slice_index"]],
                              rejection["findings"],
                              limit=1_500 if provider == "kimi" else 12_000,
                          ),
                      }
                  packet_digests.append(_digest(packet))
                  result, usage, actual = _call(
                      provider,
                      contract + json.dumps(packet, separators=(",", ":")),
                      (600, 1200),
                      validate=lambda value: _require_cross_schema(value, provider),
                  )
                  all_validations_complete = (
                      all_validations_complete and result["validation_complete"]
                  )
                  blockers.extend(str(item) for item in result["confirmed_blockers"])
                  usages.append(usage)
                  actual_models.add(actual)
              record = {
                  "provider": provider,
                  "model_actual": ",".join(sorted(actual_models)),
                  "validates_provider": peer,
                  "head_sha": head,
                  "validates_receipt": _digest(
                      {
                          "peer_provider": peer,
                          "head_sha": head,
                          "peer_receipts": sorted(receipts),
                      }
                  ),
                  "validation_packets_sha256": _digest(packet_digests),
                  "validation_complete": all_validations_complete,
                  "confirmed_blockers": list(dict.fromkeys(blockers)),
                  "usage": {"calls": usages},
              }
              record["receipt"] = _digest(record)
              return record


          def _final(primary: list[dict], cross: list[dict], head: str) -> dict:
              primary_commitments = []
              for provider in sorted(SPECIALTIES):
                  records = sorted(
                      (record for record in primary if record["provider"] == provider),
                      key=lambda record: record["slice_index"],
                  )
                  receipts = [record["receipt"] for record in records]
                  rejected_receipts = [
                      record["receipt"] for record in records if record["verdict"] == "REJECT"
                  ]
                  primary_commitments.append(
                      {
                          "provider": provider,
                          "head_sha": head,
                          "primary_count": len(records),
                          "approved": len(records) - len(rejected_receipts),
                          "rejected": len(rejected_receipts),
                          "receipts_sha256": _digest(
                              {
                                  "provider": provider,
                                  "head_sha": head,
                                  "receipts": receipts,
                              }
                          ),
                          "rejected_receipts": rejected_receipts,
                      }
                  )
              cross_commitments = [
                  {
                      "provider": record["provider"],
                      "validates_provider": record["validates_provider"],
                      "head_sha": record["head_sha"],
                      "validation_complete": record["validation_complete"],
                      "confirmed_blocker_count": len(record["confirmed_blockers"]),
                      "confirmed_blockers_sha256": _digest(record["confirmed_blockers"]),
                      "receipt": record["receipt"],
                  }
                  for record in sorted(
                      cross, key=lambda record: (record["provider"], record["validates_provider"])
                  )
              ]
              dossier = {
                  "schema": SCHEMA,
                  "head_sha": head,
                  "primary_commitments": primary_commitments,
                  "cross_commitments": cross_commitments,
              }
              dossier_json = json.dumps(dossier, separators=(",", ":"))
              if len(dossier_json) > _MAX_FINAL_DOSSIER_CHARS:
                  raise RuntimeError(
                      "validator final dossier exceeds deterministic character budget "
                      f"(chars={len(dossier_json)} cap={_MAX_FINAL_DOSSIER_CHARS})"
                  )
              # Final decision contract: tests/test_validator_chain.py.
              prompt = (
                  "You are the final OpenAI approval gate. Return ONLY JSON with decision "
                  '("APPROVE", "REJECT", or "BLOCKED") and rationale (one short string). '
                  "APPROVE only when both reciprocal cross-validations completed and their "
                  "confirmed_blocker_count values are zero. "
                  "(contract: tests/test_validator_chain.py) "
                  "A peer may clear an unsupported specialist rejection. This is "
                  "a compact evidence dossier, not a request to redo the code review.\n"
                  + dossier_json
              )
              result, usage, actual = _call(
                  "openai", prompt, (4000, 8000), validate=_require_final_schema
              )
              decision = result.get("decision")
              mechanically_clear = all(
                  r["validation_complete"] and not r["confirmed_blockers"] for r in cross
              )
              if decision == "APPROVE" and not mechanically_clear:
                  decision = "BLOCKED"
                  result["rationale"] = (
                      "OpenAI approval contradicted unresolved specialist evidence."
                  )
              return {
                  "provider": "openai",
                  "model_actual": actual,
                  "head_sha": head,
                  "accepted_receipts": sorted(r["receipt"] for r in primary + cross),
                  "decision": decision,
                  "rationale": str(result.get("rationale", ""))[:500],
                  "usage": usage,
              }


          def _validate_primary_matrix(primary: list[dict], slices: list[str], head: str) -> None:
              """Bind the concurrent result set to every source slice and both providers."""
              expected = {
                  (provider, index) for provider in SPECIALTIES for index in range(len(slices))
              }
              actual = {
                  (str(record.get("provider")), record.get("slice_index")) for record in primary
              }
              if len(primary) != len(expected) or actual != expected:
                  raise RuntimeError(
                      "validator primary evidence matrix is incomplete or duplicated"
                  )
              for record in primary:
                  provider = record["provider"]
                  index = record["slice_index"]
                  source = slices[index]
                  if (
                      record.get("head_sha") != head
                      or record.get("skill")
                      != SPECIALTIES[provider][index % len(SPECIALTIES[provider])]
                      or record.get("slice_sha256") != hashlib.sha256(source.encode()).hexdigest()
                      or record.get("slice_bytes") != len(source.encode())
                  ):
                      raise RuntimeError(
                          "validator primary evidence is not bound to its source slice"
                      )
                  unsigned = {key: value for key, value in record.items() if key != "receipt"}
                  if record.get("receipt") != _digest(unsigned):
                      raise RuntimeError("validator primary receipt is invalid")


          def validate_manifest(manifest: dict, expected_head: str) -> tuple[bool, str]:
              if (
                  manifest.get("schema") != SCHEMA
                  or manifest.get("head_sha") != expected_head
                  or not re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("diff_sha256", "")))
              ):
                  return False, "schema or head mismatch"
              deterministic = manifest.get("deterministic_checks", {})
              if (
                  not isinstance(deterministic.get("name"), str)
                  or not deterministic["name"].strip()
                  or deterministic.get("conclusion") != "success"
                  or deterministic.get("head_sha") != expected_head
              ):
                  return False, "deterministic current-head receipt missing"
              primary, cross, final = (
                  manifest.get("primary", []),
                  manifest.get("cross", []),
                  manifest.get("final", {}),
              )
              coverage = manifest.get("coverage", {})
              slice_count = coverage.get("slice_count")
              if (
                  not isinstance(slice_count, int)
                  or isinstance(slice_count, bool)
                  or slice_count < _MIN_SLICES
                  or not isinstance(coverage.get("slice_budget_chars"), int)
                  or isinstance(coverage.get("slice_budget_chars"), bool)
                  or coverage["slice_budget_chars"] < 1
              ):
                  return False, "slice coverage commitment missing"
              reviewed_bytes = coverage.get("reviewed_bytes")
              total_bytes = coverage.get("total_bytes")
              if (
                  not isinstance(reviewed_bytes, int)
                  or isinstance(reviewed_bytes, bool)
                  or reviewed_bytes <= 0
                  or reviewed_bytes != total_bytes
              ):
                  return False, "full diff coverage missing"
              expected_matrix = {
                  (provider, index) for provider in SPECIALTIES for index in range(slice_count)
              }
              if coverage.get("primary_calls") != len(expected_matrix):
                  return False, "primary-call coverage commitment mismatch"
              actual_matrix = []
              slice_bindings: dict[int, tuple[str, int]] = {}
              for record in primary:
                  provider = record.get("provider")
                  index = record.get("slice_index")
                  if (
                      provider not in SPECIALTIES
                      or not isinstance(index, int)
                      or isinstance(index, bool)
                      or index < 0
                      or index >= slice_count
                  ):
                      return False, "invalid specialist matrix coordinates"
                  actual_matrix.append((provider, index))
                  slice_sha256 = str(record.get("slice_sha256", ""))
                  slice_bytes = record.get("slice_bytes")
                  if (
                      not re.fullmatch(r"[0-9a-f]{64}", slice_sha256)
                      or not isinstance(slice_bytes, int)
                      or isinstance(slice_bytes, bool)
                      or slice_bytes < 1
                  ):
                      return False, "invalid specialist slice commitment"
                  binding = (slice_sha256, slice_bytes)
                  if index in slice_bindings and slice_bindings[index] != binding:
                      return False, "specialist slice commitments disagree"
                  slice_bindings[index] = binding
                  unsigned = {key: value for key, value in record.items() if key != "receipt"}
                  if (
                      record.get("head_sha") != expected_head
                      or record.get("skill")
                      != SPECIALTIES[provider][index % len(SPECIALTIES[provider])]
                      or record.get("receipt") != _digest(unsigned)
                  ):
                      return False, "stale or unbound specialist evidence"
              if (
                  len(actual_matrix) != len(expected_matrix)
                  or set(actual_matrix) != expected_matrix
              ):
                  return False, "specialist evidence matrix incomplete or duplicated"
              pairs = {(r.get("provider"), r.get("validates_provider")) for r in cross}
              if len(cross) != 2 or pairs != {("deepseek", "kimi"), ("kimi", "deepseek")}:
                  return False, "reciprocal cross-validation missing"
              for record in cross:
                  unsigned = {key: value for key, value in record.items() if key != "receipt"}
                  peer = record.get("validates_provider")
                  peer_receipts = sorted(
                      item["receipt"] for item in primary if item["provider"] == peer
                  )
                  expected_peer_receipt = _digest(
                      {
                          "peer_provider": peer,
                          "head_sha": expected_head,
                          "peer_receipts": peer_receipts,
                      }
                  )
                  if (
                      record.get("head_sha") != expected_head
                      or record.get("validates_receipt") != expected_peer_receipt
                      or not re.fullmatch(
                          r"[0-9a-f]{64}", str(record.get("validation_packets_sha256", ""))
                      )
                      or record.get("receipt") != _digest(unsigned)
                  ):
                      return False, "stale or unbound cross-validation evidence"
              # Reciprocal blocker contract: tests/test_validator_chain.py.
              if any(
                  not r.get("validation_complete") or r.get("confirmed_blockers") for r in cross
              ):
                  return False, "cross-validation confirmed blockers"
              receipts = sorted(r["receipt"] for r in primary + cross)
              if (
                  final.get("provider") != "openai"
                  or final.get("head_sha") != expected_head
                  or final.get("decision") != "APPROVE"
                  or final.get("accepted_receipts") != receipts
              ):
                  return False, "OpenAI final approval missing or unbound"
              return True, "approved"


          def validate_public_manifest(manifest: dict, expected_head: str) -> tuple[bool, str]:
              """Validate the posted aggregate commitment, not the artifact's full rows."""
              if (
                  manifest.get("schema") != SCHEMA
                  or manifest.get("projection") != PUBLIC_PROJECTION
                  or manifest.get("head_sha") != expected_head
                  or not re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("diff_sha256", "")))
                  or not re.fullmatch(
                      r"[0-9a-f]{64}", str(manifest.get("full_manifest_sha256", ""))
                  )
              ):
                  return False, "public projection schema, head, or artifact commitment mismatch"
              deterministic = manifest.get("deterministic_checks", {})
              if (
                  not isinstance(deterministic.get("name"), str)
                  or not deterministic["name"].strip()
                  or deterministic.get("conclusion") != "success"
                  or deterministic.get("head_sha") != expected_head
              ):
                  return False, "deterministic current-head receipt missing"
              coverage = manifest.get("coverage", {})
              slice_count = coverage.get("slice_count")
              if (
                  not isinstance(coverage.get("reviewed_bytes"), int)
                  or isinstance(coverage.get("reviewed_bytes"), bool)
                  or coverage["reviewed_bytes"] <= 0
                  or coverage.get("reviewed_bytes") != coverage.get("total_bytes")
                  or not isinstance(slice_count, int)
                  or isinstance(slice_count, bool)
                  or slice_count < _MIN_SLICES
                  or not isinstance(coverage.get("slice_budget_chars"), int)
                  or isinstance(coverage.get("slice_budget_chars"), bool)
                  or coverage["slice_budget_chars"] < 1
                  or coverage.get("primary_calls") != slice_count * len(SPECIALTIES)
              ):
                  return False, "full diff coverage missing"
              primary = manifest.get("primary", [])
              expected_aggregates = {
                  (provider, skill)
                  for provider, skills in SPECIALTIES.items()
                  for skill in skills
              }
              actual_aggregates = []
              for record in primary:
                  provider, skill = record.get("provider"), record.get("skill")
                  actual_aggregates.append((provider, skill))
                  if (
                      record.get("head_sha") != expected_head
                      or not isinstance(record.get("instance_count"), int)
                      or isinstance(record.get("instance_count"), bool)
                      or record["instance_count"] < 1
                      or record.get("receipt") != record.get("receipts_sha256")
                      or not re.fullmatch(r"[0-9a-f]{64}", str(record.get("receipt", "")))
                  ):
                      return False, "invalid public specialist commitment"
              if (
                  len(actual_aggregates) != len(expected_aggregates)
                  or set(actual_aggregates) != expected_aggregates
              ):
                  return False, "public specialist commitments incomplete or duplicated"
              if sum(record["instance_count"] for record in primary) != coverage.get(
                  "primary_calls"
              ):
                  return False, "public specialist count does not match coverage"
              for provider in SPECIALTIES:
                  if (
                      sum(
                          record["instance_count"]
                          for record in primary
                          if record["provider"] == provider
                      )
                      != slice_count
                  ):
                      return False, "public provider slice count does not match coverage"
              cross = manifest.get("cross", [])
              pairs = {(r.get("provider"), r.get("validates_provider")) for r in cross}
              if len(cross) != 2 or pairs != {("deepseek", "kimi"), ("kimi", "deepseek")}:
                  return False, "public reciprocal cross-validation missing"
              for record in cross:
                  if (
                      record.get("head_sha") != expected_head
                      or not record.get("validation_complete")
                      or record.get("confirmed_blockers")
                      or not re.fullmatch(r"[0-9a-f]{64}", str(record.get("receipt", "")))
                      or not re.fullmatch(
                          r"[0-9a-f]{64}", str(record.get("validates_receipt", ""))
                      )
                      or not re.fullmatch(
                          r"[0-9a-f]{64}", str(record.get("validation_packets_sha256", ""))
                      )
                  ):
                      return False, "invalid public cross-validation commitment"
              final = manifest.get("final", {})
              receipts = sorted(record["receipt"] for record in primary + cross)
              if (
                  final.get("provider") != "openai"
                  or final.get("head_sha") != expected_head
                  or final.get("decision") != "APPROVE"
                  or final.get("accepted_receipts") != receipts
              ):
                  return False, "public OpenAI approval missing or unbound"
              return True, "approved"


          def public_manifest(manifest: dict) -> dict:
              """Project exhaustive slice evidence into a GitHub-sized commitment.

              The full manifest is retained as an Actions artifact. GitHub's review API
              rejects bodies over 65,536 characters, so the posted receipt carries one
              cryptographic aggregate per provider/skill plus the reciprocal checks.
              """
              aggregates = []
              for provider in sorted(SPECIALTIES):
                  for skill in SPECIALTIES[provider]:
                      records = [
                          record
                          for record in manifest["primary"]
                          if record["provider"] == provider and record["skill"] == skill
                      ]
                      receipts = sorted(record["receipt"] for record in records)
                      commitment = _digest(
                          {
                              "provider": provider,
                              "skill": skill,
                              "head_sha": manifest["head_sha"],
                              "receipts": receipts,
                          }
                      )
                      aggregates.append(
                          {
                              "provider": provider,
                              "instance": f"{provider}-{skill}-aggregate",
                              "skill": skill,
                              "head_sha": manifest["head_sha"],
                              "instance_count": len(records),
                              "receipts_sha256": commitment,
                              "receipt": commitment,
                          }
                      )
              cross = [
                  {
                      key: record[key]
                      for key in (
                          "provider",
                          "validates_provider",
                          "head_sha",
                          "validation_complete",
                          "confirmed_blockers",
                          "validates_receipt",
                          "validation_packets_sha256",
                          "receipt",
                      )
                  }
                  for record in manifest["cross"]
              ]
              accepted = sorted(
                  [record["receipt"] for record in aggregates]
                  + [record["receipt"] for record in cross]
              )
              full_json = json.dumps(manifest, sort_keys=True, separators=(",", ":"))
              return {
                  "schema": manifest["schema"],
                  "projection": PUBLIC_PROJECTION,
                  "head_sha": manifest["head_sha"],
                  "diff_sha256": manifest["diff_sha256"],
                  "coverage": manifest["coverage"],
                  "deterministic_checks": manifest["deterministic_checks"],
                  "full_manifest_sha256": hashlib.sha256(full_json.encode()).hexdigest(),
                  "primary": aggregates,
                  "cross": cross,
                  "final": {
                      "provider": manifest["final"]["provider"],
                      "head_sha": manifest["final"]["head_sha"],
                      "decision": manifest["final"]["decision"],
                      "rationale": manifest["final"]["rationale"],
                      "accepted_receipts": accepted,
                  },
              }


          def run(diff: str, total_bytes: int, deterministic: dict, head: str) -> dict:
              slice_budget = _slice_char_budget()
              slices = _diff_slices(diff, max_chars=slice_budget)
              primary_call_count = len(slices) * len(SPECIALTIES)
              if primary_call_count > _MAX_PRIMARY_CALLS:
                  raise RuntimeError(
                      "validator plan exceeds bounded primary-call budget "
                      f"(calls={primary_call_count} cap={_MAX_PRIMARY_CALLS} "
                      f"slice_chars={slice_budget}); configure a supported long-context "
                      "Kimi review model"
                  )
              workers = min(8, primary_call_count)
              print(
                  "validator chain plan: "
                  f"diff_bytes={len(diff.encode())} slices={len(slices)} "
                  f"primary_calls={primary_call_count} workers={workers} "
                  f"slice_budget_chars={slice_budget}",
                  file=sys.stderr,
                  flush=True,
              )
              jobs = []
              with ThreadPoolExecutor(max_workers=workers) as pool:
                  for index, diff_slice in enumerate(slices):
                      for provider, skills in SPECIALTIES.items():
                          skill = skills[index % len(skills)]
                          jobs.append(
                              pool.submit(
                                  _primary, provider, skill, index, len(slices), diff_slice, head
                              )
                          )
                  primary = []
                  try:
                      for completed, job in enumerate(as_completed(jobs), 1):
                          primary.append(job.result())
                          # Progress receipt contract: tests/test_validator_chain.py.
                          print(
                              f"validator primary progress: completed={completed} "
                              f"total={primary_call_count}",
                              file=sys.stderr,
                              flush=True,
                          )
                  except Exception:
                      for job in jobs:
                          job.cancel()
                      raise
              primary.sort(key=lambda r: (r["provider"], r["slice_index"]))
              _validate_primary_matrix(primary, slices, head)

              by_provider = {p: [r for r in primary if r["provider"] == p] for p in SPECIALTIES}
              with ThreadPoolExecutor(max_workers=2) as pool:
                  jobs = [
                      pool.submit(
                          _cross,
                          "deepseek",
                          "kimi",
                          by_provider["kimi"],
                          slices,
                          deterministic,
                          head,
                      ),
                      pool.submit(
                          _cross,
                          "kimi",
                          "deepseek",
                          by_provider["deepseek"],
                          slices,
                          deterministic,
                          head,
                      ),
                  ]
                  cross = []
                  try:
                      for completed, job in enumerate(as_completed(jobs), 1):
                          cross.append(job.result())
                          # Progress receipt contract: tests/test_validator_chain.py.
                          print(
                              f"validator cross progress: completed={completed} total=2",
                              file=sys.stderr,
                              flush=True,
                          )
                  except Exception:
                      for job in jobs:
                          job.cancel()
                      raise
              cross.sort(key=lambda r: r["provider"])
              final = _final(primary, cross, head)
              return {
                  "schema": SCHEMA,
                  "head_sha": head,
                  "diff_sha256": hashlib.sha256(diff.encode()).hexdigest(),
                  "coverage": {
                      "reviewed_bytes": len(diff.encode()),
                      "total_bytes": total_bytes,
                      "slice_count": len(slices),
                      "slice_budget_chars": slice_budget,
                      "primary_calls": primary_call_count,
                  },
                  "deterministic_checks": deterministic,
                  "primary": primary,
                  "cross": cross,
                  "final": final,
              }


          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--diff", required=True)
              parser.add_argument("--total-bytes-file", required=True)
              parser.add_argument("--expected-head", required=True)
              parser.add_argument("--deterministic-receipt", required=True)
              parser.add_argument("--out", required=True)
              args = parser.parse_args()
              diff = Path(args.diff).read_text(errors="replace")
              total = int(Path(args.total_bytes_file).read_text().strip() or "0")
              deterministic = json.loads(Path(args.deterministic_receipt).read_text())
              if (
                  deterministic.get("conclusion") != "success"
                  or deterministic.get("head_sha") != args.expected_head
                  or not str(deterministic.get("name", "")).strip()
              ):
                  print(
                      "validator chain requires a successful current-head deterministic receipt",
                      file=sys.stderr,
                  )
                  return 1
              if len(diff.encode()) != total:
                  print("validator chain refuses partial diff coverage", file=sys.stderr)
                  return 1
              try:
                  manifest = run(diff, total, deterministic, args.expected_head)
                  approved, reason = validate_manifest(manifest, args.expected_head)
              except Exception as exc:  # fail closed: provider outage/schema/refusal
                  print(f"validator chain blocked: {type(exc).__name__}: {exc}", file=sys.stderr)
                  return 1
              full_json = json.dumps(manifest, sort_keys=True, separators=(",", ":"))
              Path(args.out + ".manifest.json").write_text(full_json)
              posted_manifest = public_manifest(manifest)
              body = (
                  "🤖 **OpenAI final approval** (DeepSeek + Kimi reciprocal specialist chain)\n\n"
                  f"Decision: **{manifest['final']['decision']}** — {manifest['final']['rationale']}\n\n"
                  "Full per-slice evidence is retained in the validator-manifest Actions artifact; "
                  "the receipt below commits to it by SHA-256.\n\n"
                  "<!-- validator-chain-manifest\n"
                  + json.dumps(posted_manifest, sort_keys=True, separators=(",", ":"))
                  + "\n-->"
              )
              Path(args.out).write_text(
                  json.dumps({"event": "COMMENT", "commit_id": args.expected_head, "body": body})
              )
              status_path = Path(args.out + ".status")
              if not approved:
                  print(f"validator chain rejected: {reason}", file=sys.stderr)
                  print(
                      json.dumps(
                          {
                              "primary": manifest["primary"],
                              "cross": manifest["cross"],
                              "final": manifest["final"],
                          },
                          sort_keys=True,
                      ),
                      file=sys.stderr,
                  )
                  status_path.write_text("rejected\n")
                  return 0  # post the evidence; the workflow's enforcement step stays red
              status_path.write_text("approved\n")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          # <<< VERBATIM harness/scripts/validator_chain.py (sync-enforced)
          EMBED_VALIDATOR_CHAIN
      - name: wait for deterministic check receipt
        if: inputs.provider == 'pipeline' && steps.applicability.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          DETERMINISTIC_CHECK: ${{ inputs.deterministic_check }}
        run: |
          for attempt in $(seq 1 30); do
            state=$(gh api "repos/${{ github.repository }}/commits/$EXPECTED_HEAD/check-runs"               --jq "[.check_runs[] | select(.name == \"$DETERMINISTIC_CHECK\")] | last | \"\(.status):\(.conclusion)\"" 2>/dev/null || true)
            if [ "$state" = "completed:success" ]; then
              jq -n --arg name "$DETERMINISTIC_CHECK" --arg head "$EXPECTED_HEAD"                 '{name:$name, conclusion:"success", head_sha:$head}' > /tmp/deterministic-receipt.json
              exit 0
            fi
            if [[ "$state" == completed:* ]]; then
              echo "::error::$DETERMINISTIC_CHECK is $state"
              exit 1
            fi
            echo "$DETERMINISTIC_CHECK state=${state:-absent} ($attempt/30)"
            sleep 10
          done
          echo "::error::$DETERMINISTIC_CHECK did not complete in 5 minutes (.github/workflows/ai-review-reusable.yml)"
          exit 1
      - name: review via ${{ inputs.provider }}
        if: steps.applicability.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          # Keep the reviewer selectable without silently falling back to an
          # 8K route. Kimi's model list dated 2026-07-28 names K3 as the current
          # 1M-context model; the repository/org variable remains the override.
          # Source record: docs/research/2026-07-28__validator-model-context-sources.md
          KIMI_REVIEW_MODEL: ${{ vars.KIMI_REVIEW_MODEL || 'kimi-k3' }}
          # Same failure shape as the Kimi line above, different cause: DeepSeek
          # retired `deepseek-chat`, so the hardcoded name returned HTTP 400
          # ("supported API model names are deepseek-v4-pro or deepseek-v4-flash",
          # measured run 30158542188, 2026-07-25). The call exits 0 with no review,
          # so the check went green while quorum silently starved. The default is
          # now a live model; this var makes the next rename a variable change.
          DEEPSEEK_REVIEW_MODEL: ${{ vars.DEEPSEEK_REVIEW_MODEL }}
          AI_CALL_RECEIPT_JOURNAL: /tmp/ai-call-receipts/receipts.jsonl
        # Scrubbed transport: seat-contract dispatch scrub (fail-closed => no
        # review, ::warning), 429/5xx retry, defensive envelope parsing,
        # token receipts. SSOT: harness/scripts/ai_review.py.
        run: |
          python3 -m pip install --quiet certifi pyyaml
          if [ "${{ inputs.provider }}" = "pipeline" ]; then
            # Run 30400693262 received an external hosted-runner shutdown near
            # 30 minutes before its always() uploads ran. Bound our own model
            # process first so partial, content-free failure receipts still have
            # time to be preserved within the explicit job deadline.
            timeout --signal=TERM --kill-after=15s 20m               python3 -u /tmp/aiwf/harness/scripts/validator_chain.py --diff /tmp/pr_diff_full.txt --total-bytes-file /tmp/pr_diff_total_bytes.txt --deterministic-receipt /tmp/deterministic-receipt.json --expected-head "${{ github.event.pull_request.head.sha }}" --out /tmp/review.json
          else
            python3 /tmp/aiwf/harness/scripts/ai_review.py --provider "${{ inputs.provider }}" --diff /tmp/pr_diff.txt --total-bytes-file /tmp/pr_diff_total_bytes.txt --out /tmp/review.json
          fi
      - name: upload content-free AI call receipts
        if: always() && steps.applicability.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-call-receipts-${{ inputs.provider }}-${{ github.run_attempt }}
          path: /tmp/ai-call-receipts/receipts.jsonl*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14
      - name: upload full validator manifest
        if: always() && inputs.provider == 'pipeline' && steps.applicability.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validator-manifest-${{ github.run_attempt }}
          path: /tmp/review.json.manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: submit review (review-only, never approve)
        if: steps.applicability.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ inputs.provider }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f /tmp/review.json ]; then
            # Warning, not failure: quorum is enforced deterministically by
            # verifier-gate counting REVIEWS; a dead substrate must not block
            # merges other reviewers already cover (quota-outage deadlock,
            # measured on fleet-config#181 2026-07-23).
            echo "::warning::$PROVIDER produced no review — substrate absent from quorum this run"
            exit 0
          fi
          current=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)
          if [ "$current" != "$EXPECTED_HEAD" ]; then
            echo "::error::stale validator run: expected $EXPECTED_HEAD, current $current"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" -X POST --input /tmp/review.json
      - name: enforce staged decision
        if: inputs.provider == 'pipeline' && steps.applicability.outputs.skip != 'true'
        run: |
          # validator_chain.py always writes this decision receipt beside
          # --out, including for rejected heads so their evidence is posted.
          test -f /tmp/review.json.status || {
            echo "::error::validator decision receipt missing"
            exit 1
          }
          test "$(cat /tmp/review.json.status)" = "approved" || {
            echo "::error::specialist or final validator rejected this head"
            exit 1
          }
      - name: nudge verifier-gate re-run (bot reviews emit no workflow events)
        if: always() && steps.applicability.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rid=$(gh run list --repo "${{ github.repository }}" --workflow verifier-gate.yml --branch "$HEAD_REF" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$rid" ]; then gh run rerun "$rid" --repo "${{ github.repository }}" 2>/dev/null || gh run rerun "$rid" --repo "${{ github.repository }}" --failed 2>/dev/null || echo "verifier nudge skipped"; else echo "no verifier run to nudge"; fi
