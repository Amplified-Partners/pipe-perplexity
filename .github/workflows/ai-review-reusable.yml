          def _retry_after_seconds(exc: Exception) -> float | None:
              """Seconds from a Retry-After header, or None when absent/unusable.

              Only the delta-seconds form is honoured. The HTTP-date form is legal but
              needs a trusted clock and timezone parse to be safe, and getting that
              subtly wrong would sleep for hours on a required check — declining to
              parse it is the conservative read, not an oversight.
              """
              headers = getattr(exc, "headers", None)
              raw = headers.get("Retry-After") if headers is not None else None
              if raw is None:
                  return None
              try:
                  seconds = float(str(raw).strip())
              except (TypeError, ValueError):
                  return None
              return seconds if seconds >= 0 else None


