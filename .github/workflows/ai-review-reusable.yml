                  print(f"dispatch scrub redacted {len(scrub.redactions)} value(s) — "
                        f"review proceeds on sanitized text: {'; '.join(scrub.redactions)}")
              elif scrub.blocked:
                  _record_dispatch_blocked(args.provider, model)
                  print(f"::warning::dispatch scrub blocked this diff — no {display} review: {'; '.join(scrub.reasons)}")
                  return 0

              payload: dict = {"model": model, "messages": [{"role": "user", "content": prompt}]}
              if args.provider == "openai":
                  payload["max_completion_tokens"] = 1200
              elif args.provider == "kimi":
