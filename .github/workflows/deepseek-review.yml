# Signed-by: cascade-mac (Cairn) | 2026-07-23 | ai-review thin caller
# Independent review-only reviewer (DeepSeek substrate). Thin caller: ALL transport
# logic lives in amplified-fleet-config's ai-review-reusable.yml (SSOT
# harness/scripts/ai_review.py, sync-pinned embed) — scrubbed transport,
# retry, defensive parsing, token receipts. Review only: no approve, no
# merge, no PAT. Absent review = ::warning; quorum is enforced by
# verifier-gate counting review sources, not by this check.
name: deepseek-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: deepseek-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  deepseek-review:
    if: github.event.pull_request.draft == false
    uses: Amplified-Partners/amplified-fleet-config/.github/workflows/ai-review-reusable.yml@main
    with:
      provider: deepseek
    secrets: inherit
