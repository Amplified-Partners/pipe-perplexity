              # it cost, in the review body itself.
              receipt = f"{usage.get('prompt_tokens', '?')} in / {usage.get('completion_tokens', '?')} out"
              Path(args.out).write_text(
                  json.dumps(
                      {
                          "event": "COMMENT",
