                  # is allowed for this model", measured 2026-07-23) — send exactly 1.
                  # Budget stays at 1200: moonshot-v1-8k is a non-reasoning model with an
                  # 8k TOTAL context, so a large completion budget would crowd the prompt.
                  payload["temperature"] = 1
                  payload["max_tokens"] = 1200
              else:
                  payload["temperature"] = 0.1
