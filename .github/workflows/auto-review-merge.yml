# Five Rods Auto-Review + Merge — estate unified v2
# Signed-by: claude-cowork (Ewan's Cowork session) | 2026-07-23
# Lineage: clean-build original 2026-05-21 -> cascade-mac estate port ca662a60
#          -> v2 -> v3 (this file). THIS file (governance/templates/) IS the
#          SSOT — until 2026-07-23 the v2 template lived only as a loose file
#          (~/amp-worktrees/auto-review-merge-v2.yml) while claiming an SSOT
#          copy here that did not exist; v3 lands it (plan 2026-07-23-002 U8).
# v3 changes (plan 2026-07-23-002 U8+U9, container-on-m5 repo):
#   3. ESTATE FREEZE: org Actions variable ESTATE_AUTOMERGE_FREEZE=1 pauses
#      auto-merge ARMING estate-wide (incident brake). Reviews still run and
#      post; only the merge arm is withheld, with a visible notice.
#   4. COVERAGE DECLARATION: diff cap raised 60KB->150KB and every review body
#      ends with a reviewed-bytes coverage line; a truncated diff is DECLARED
#      (60KB head-truncation silently fed partial evidence -> hallucinated
#      findings, observed 2026-07-23).
# v2 changes, each with observed backing (2026-07-23):
#   1. MERGE-BASE DIFF: v1 diffed BASE_SHA..HEAD_SHA (two-dot snapshot). When
#      main advanced past the branch point, everything main gained appeared as
#      DELETIONS authored by the PR — reviewers then "saw" workflow files being
#      deleted that the PR never touched (intent-interface#20 review).
#      v2 uses three-dot (merge-base) semantics: the diff is what the PR
#      actually changes.
#   2. ANCHOR-CHECK: a CHANGES_REQUESTED review must cite at least one file
#      that exists in the diff. Reviews citing only nonexistent files are
#      hallucinations (intent-interface#20: four "missing import" defects for
#      imports present at lines 12/16/17). Unanchored blocking reviews are
#      discarded: verdict becomes UNANCHORED — no auto-merge, no block, full
#      transparency comment. The gate never enforces a claim the diff cannot back.
name: Five Rods Auto-Review + Merge
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  # Restored in v3 (regression caught by control-centre's own reviewer on the
  # v3 rollout PR): three repos carried this locally and the SSOT lacked it.
  # Without it, rapid pushes race on /tmp/pr_diff.txt while a review is reading.
  group: five-rods-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get PR diff (merge-base) + changed file list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE_SHA"..."$HEAD_SHA" -- . ':!*.lock' ':!package-lock.json' ':!*.min.js' ':!*.min.css' > /tmp/pr_diff_full.txt
          head -c 150000 /tmp/pr_diff_full.txt > /tmp/pr_diff.txt
          wc -c < /tmp/pr_diff_full.txt | tr -d ' ' > /tmp/pr_diff_total_bytes.txt
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > /tmp/pr_files.txt
      - name: AI Review (anchored)
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, sys, urllib.request

          # errors='replace': `head -c` can sever a multi-byte UTF-8 character at
          # the byte cap; a decode crash here would kill the review entirely.
          diff = open("/tmp/pr_diff.txt", errors="replace").read()[:150000]
          total_bytes = int(open("/tmp/pr_diff_total_bytes.txt").read().strip() or "0")
          changed = set(l.strip() for l in open("/tmp/pr_files.txt") if l.strip())
          basenames = set(p.split("/")[-1] for p in changed)
          title = os.environ.get("PR_TITLE", "")

          prompt = f"""You are an independent third-party code reviewer for Amplified Partners.
          Your role: enforce the Five Rods (constitutional principles) and catch blocking defects.
          You are NOT the code author. You are the guard.
          Cite ONLY files that appear in the diff below. Findings about files not
          in the diff are invalid and will be discarded automatically.

          PR Title: {title}

          ## Code quality (blocking issues only)
          - Bugs, security holes, logic errors, missing imports, hardcoded secrets
          - Do NOT flag style preferences, naming conventions, or minor improvements
          - Threshold: would this cause a bug, security vulnerability, or data loss?

          ## Five Rods compliance (canon/10-CONSTITUTION.md)
          1. RADICAL HONESTY  2. RADICAL TRANSPARENCY  3. RADICAL ATTRIBUTION
          4. WIN-WIN  5. IDEAS MERITOCRACY
          ULYSSES CLAUSE: any weakening of the Five Rods => CHANGES_REQUESTED, regardless of author.

          Respond with EXACTLY one of these on the first line:
          VERDICT: APPROVED
          VERDICT: CHANGES_REQUESTED

          Then your review, max 400 words, citing file + line for any finding.

          Diff:
          ```
          {diff}
          ```"""

          providers = [
              ("OpenAI", "gpt-4o-mini", "https://api.openai.com/v1/chat/completions", os.environ.get("OPENAI_API_KEY", "").strip()),
              ("DeepSeek", "deepseek-chat", "https://api.deepseek.com/chat/completions", os.environ.get("DEEPSEEK_API_KEY", "").strip()),
          ]
          review = None
          errors = []
          for pname, model, url, key in providers:
              if not key:
                  continue
              body = json.dumps({"model": model,
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.1, "max_tokens": 1500}).encode()
              req = urllib.request.Request(url, data=body,
                  headers={"Authorization": f"Bearer {key}",
                           "Content-Type": "application/json"})
              try:
                  resp = urllib.request.urlopen(req, timeout=90)
                  result = json.loads(resp.read())
                  review = f"[substrate: {pname}]\n" + result["choices"][0]["message"]["content"]
                  break
              except Exception as e:
                  errors.append(f"{pname}: {type(e).__name__}")
                  print(f"{pname} review error: {type(e).__name__}", file=sys.stderr)
          if review is None:
              review = ("VERDICT: UNAVAILABLE\n\nAll review substrates unavailable — "
                        + " | ".join(errors)
                        + ". This PR will NOT be auto-merged — merge manually after your own check, or re-push to retry.")

          # ---- deterministic anchor-check (v2) ----
          # A blocking review must cite >=1 file that the diff actually touches.
          def anchored(text):
              cands = set(re.findall(r"[\w][\w./-]*\.(?:ts|tsx|js|jsx|py|sh|yml|yaml|md|json|css|txt|rs|go)", text))
              cands = {c.lstrip("./") for c in cands}
              if not cands:
                  return False, cands
              hit = any(c in changed or c.split("/")[-1] in basenames for c in cands)
              return hit, cands

          if "VERDICT: CHANGES_REQUESTED" in review:
              ok, cited = anchored(review)
              if not ok:
                  review = ("VERDICT: UNANCHORED\n\n"
                            "The substrate returned CHANGES_REQUESTED but cited no file "
                            f"present in this PR's diff (cited: {sorted(cited)[:10] or 'none'}; "
                            f"diff files: {sorted(changed)[:10]}). Per anchor-check policy "
                            "the review is discarded as unanchored: not enforced, not merged. "
                            "Original review preserved below for the audit trail.\n\n"
                            "---- discarded review ----\n" + review)

          print(review)

          if "VERDICT: APPROVED" in review:
              verdict = "approved"
          elif "VERDICT: UNAVAILABLE" in review:
              verdict = "unavailable"
          elif "VERDICT: UNANCHORED" in review:
              verdict = "unanchored"
          else:
              verdict = "changes_requested"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"verdict={verdict}\n")

          # coverage declaration (v3): partial evidence is stated, never silent
          reviewed = min(len(diff.encode()), total_bytes) if total_bytes else len(diff.encode())
          coverage = f"diff coverage: reviewed {reviewed}/{total_bytes} bytes"
          if total_bytes and reviewed < total_bytes:
              coverage += " — TRUNCATED: partial evidence, findings may be incomplete"
          with open("/tmp/review_body.txt", "w") as f:
              f.write(f"🔍 **Five Rods Review**\n\n{review}\n\n_{coverage}_")
          PYEOF
      - name: Post verdict as PR review (audit artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --rawfile b /tmp/review_body.txt '{event: "COMMENT", body: $b}' > /tmp/review_post.json
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" -X POST --input /tmp/review_post.json
        continue-on-error: true
      - name: Estate freeze check (incident brake, v3)
        id: freeze
        env:
          ESTATE_AUTOMERGE_FREEZE: ${{ vars.ESTATE_AUTOMERGE_FREEZE }}
        run: |
          # org Actions variable, inherited by every repo; no PAT, no API call.
          # Unset/empty => not frozen (brake dormant by default).
          if [ "${ESTATE_AUTOMERGE_FREEZE}" = "1" ]; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "::warning::ESTATE_AUTOMERGE_FREEZE=1 — auto-merge arming paused estate-wide"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable auto-merge
        if: steps.review.outputs.verdict == 'approved' && steps.freeze.outputs.frozen != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --match-head-commit "${{ github.event.pull_request.head.sha }}" \
            || { echo "::error::auto-merge enable failed — surfacing, not swallowing"; exit 1; }
      - name: Estate freeze notice
        if: steps.review.outputs.verdict == 'approved' && steps.freeze.outputs.frozen == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🧊 **Estate freeze active** (ESTATE_AUTOMERGE_FREEZE=1): review APPROVED but auto-merge arming is paused estate-wide. Merge manually or wait for the freeze to lift." || true
      - name: Block on Five Rods violation
        if: steps.review.outputs.verdict == 'changes_requested'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⛔ **Five Rods Review: BLOCKED.** Reviewer found blocking issues anchored to files in this diff. See review above. Fix and push again." || true
          exit 1
      - name: Unanchored review notice
        if: steps.review.outputs.verdict == 'unanchored'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **Review discarded as unanchored.** The substrate blocked citing files absent from this diff (hallucination guard). Not enforced, not auto-merged — re-push to retry, or merge after your own check." || true
      - name: Substrates unavailable notice
        if: steps.review.outputs.verdict == 'unavailable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **Review substrates unavailable.** Five Rods review could not run (per-substrate errors in run log). This PR will not auto-merge — merge manually after your own check, or re-push once a substrate is back." || true
