# Signed-by: cascade-mac (Cairn) | 2026-07-23 | ai-review reusable substrate
# The ONE runtime for the estate's third-party review substrates (deepseek /
# kimi / openai). Callers are thin 15-line stubs (see the three *-review.yml
# in this repo, and estate repos via
#   uses: Amplified-Partners/amplified-fleet-config/.github/workflows/ai-review-reusable.yml@main
# ) — a transport fix lands HERE once and every repo runs it on its next PR.
#
# SELF-CONTAINED by design (precedent: estate-gate-reusable.yml): caller repos
# cannot check out this private vault (AUTO_MERGE_PAT probed dead 2026-07-22),
# so the transport is embedded below and pinned byte-exact to its SSOT files
# by tests/test_ai_review_reusable_sync.py — edit the SSOT, regenerate with
# harness/scripts/gen-ai-review-reusable.py, never hand-edit the embeds.
#
# Review-body markers are LOAD-BEARING for verifier-gate source counting —
# they live in harness/scripts/ai_review.py; change only together with
# verifier-gate.yml.
name: ai-review-reusable
on:
  workflow_call:
    inputs:
      provider:
        description: "deepseek | kimi | openai | pipeline"
        required: true
        type: string
      deterministic_check:
        description: "Current-head deterministic check that must succeed before validation"
        required: false
        type: string
        default: "lint-and-verify"
permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Applicability, evaluated BEFORE any work: is a third-party review even
      # possible on this PR? Dependabot-triggered workflows receive Dependabot
      # secrets, not Actions secrets, so every reviewer key resolves empty.
      # Pre-publication doctrine is deliberately blocked by dispatch_scrub, so
      # it cannot be sent to any external model by construction either.
      #
      # A review that is impossible by construction must not report as a review
      # FAILURE. That is a false signal: it says "review found a problem" when
      # it means "review could not run", and a permanently-red required check
      # starves the merge path and teaches readers to ignore red.
      #
      # This does NOT weaken the gate. Non-applicable changes stay governed by
      # deterministic checks — tests, lint, CodeQL, secret scan — at full force.
      # Pre-publication applicability is narrow by design: every changed file
      # must be Markdown under docs/, and at least one must carry a scrub marker.
      - name: applicability — can a third-party review run at all?
        id: applicability
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const actor = pr.user.login;
            if (actor === 'dependabot[bot]') {
              core.setOutput('skip', 'true');
              core.notice(`AI review NOT APPLICABLE — dependency bump by ${actor}. Reviewer keys are unavailable to Dependabot-triggered runs by GitHub design; deterministic checks govern this PR.`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number, per_page: 100
            });
            const docsOnly = files.length > 0
              && files.every(f => f.filename.startsWith('docs/') && f.filename.endsWith('.md'));
            const touchesPrePublication = files.some(
              f => f.filename.includes('docs/decided/') || f.filename.includes('pre-publication/')
            );
            if (docsOnly && touchesPrePublication) {
              core.setOutput('skip', 'true');
              core.notice('AI review NOT APPLICABLE — pre-publication docs cannot leave the dispatch scrub boundary; deterministic checks govern this PR.');
              return;
            }
            core.setOutput('skip', 'false');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.applicability.outputs.skip != 'true'
        with: { fetch-depth: 0 }
      - name: diff (merge-base, capped)
        if: steps.applicability.outputs.skip != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Three-dot = merge-base diff: review only what the PR changes, not
        # what main did meanwhile (v2 estate fix, 2026-07-23). Coverage policy
        # (plan 2026-07-23-002 U9): 150KB cap with DECLARED truncation —
        # ai_review.py appends a coverage line via pr_diff_total_bytes.
        run: |
          # Zero context is a privacy and token-efficiency boundary: validators
          # receive every changed line and its location, but no unchanged
          # neighbouring source that the change did not ask them to review.
          #
          # The generated reusable is excluded ONLY where it is a duplicate —
          # i.e. in the vault, where harness/scripts/ai_review.py is the SSOT,
          # is itself reviewed, and the sync test is the deterministic proof
          # that the two agree. Reviewing both would bill the same diff twice.
          #
          # In a CONSUMER repo the SSOT is absent, so this file is the ONLY
          # copy of the harness. Excluding it there had two costs, both
          # measured on the 2026-07-28 fan-out (estate-machine#77 and five
          # siblings): the consumer's entire validator change went unreviewed,
          # AND a PR touching only this file produced an empty diff ->
          # coverage.total_bytes == 0 -> verifier-gate's `total_bytes > 0`
          # could never hold. A gate with no satisfying condition, on exactly
          # the PRs that carry harness fixes to the repos that run them.
          #
          # Presence of the SSOT is the discriminator, not a repo name: it is
          # the property that actually makes the copy redundant, and it stays
          # correct if the vault is ever renamed or a second vault appears.
          EXCLUDE_GENERATED=()
          if [ -f harness/scripts/ai_review.py ]; then
            EXCLUDE_GENERATED=(':!.github/workflows/ai-review-reusable.yml')
          fi
          git diff --unified=0 "$BASE"..."$HEAD" -- . ':!*.lock' ':!package-lock.json' ':!*.min.js' ':!*.min.css' "${EXCLUDE_GENERATED[@]}" > /tmp/pr_diff_full.txt
          head -c 150000 /tmp/pr_diff_full.txt > /tmp/pr_diff.txt
          wc -c < /tmp/pr_diff_full.txt | tr -d ' ' > /tmp/pr_diff_total_bytes.txt
      - name: materialize vault transport (sync-pinned embeds)
        if: steps.applicability.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/aiwf/harness/scripts
          cat > /tmp/aiwf/POLICY.yaml <<'EMBED_POLICY'
          # >>> SYNC POLICY.yaml dispatch_scrub (parsed-equal; tests/test_ai_review_reusable_sync.py)
          dispatch_scrub:
            pre_publication_markers:
            - /docs/decided/
            - /pre-publication/
            sensitive_roots:
            - ~/.config/amplified/secrets.env
            - ~/.ssh/
            - ~/.aws/
            - ~/.gnupg/
            - ~/.config/gh/hosts.yml
          # <<< SYNC POLICY.yaml dispatch_scrub
          EMBED_POLICY
          cat > /tmp/aiwf/harness/dispatch_scrub.py <<'EMBED_DISPATCH_SCRUB'
          # >>> VERBATIM harness/dispatch_scrub.py (sync-enforced)
          #!/usr/bin/env python3
          """dispatch_scrub.py — the ONE dispatch choke point's default-deny scrub (R13/R14,
          seat-parity U6). Deny-list CLASSES, not a hand-maintained string list:

            1. secret-shaped tokens       — provider API-key prefixes (reuses the same
                                             patterns post-tool-redact.py already masks on
                                             tool output, so the two surfaces agree).
            2. credential-style KEY=VALUE — a NAME that looks like a secret (reuses the
                                             pre-bash-secret-guard.py identifier-name rule)
                                             assigned a non-trivial value in the payload text.
            3. sensitive-root references  — a payload that names a path under a declared
                                             sensitive root (POLICY.yaml `dispatch_scrub.
                                             sensitive_roots` — the single declaration point,
                                             OQ1). Loosening that list is a `policy_change`
                                             (POLICY.yaml's own reserved_for_ewan gate).
            4. pre-publication doctrine   — a payload naming a path under a declared
                                             pre-publication marker (same POLICY.yaml key).

          Uniform across every provider/model — this module is called ONCE, inside the
          shared transport (deepseek_run.py today; every future provider transport calls
          it too, per seat-contract.md). FAILS CLOSED: any exception while scrubbing is
          itself a block, never a silent pass-through (a scrub that can't run is not a
          scrub).
          """
          from __future__ import annotations

          import os
          import re
          from dataclasses import dataclass, field
          from pathlib import Path
          from typing import Any

          import yaml

          HERE = Path(__file__).resolve().parent
          POLICY_YAML = HERE.parent / "POLICY.yaml"

          # Same prefixes dot_claude/hooks/executable_post-tool-redact.py masks on tool
          # output — kept in sync deliberately (one vocabulary of "what a secret looks
          # like" across the estate, not two that can drift apart).
          SECRET_TOKEN_PATTERNS: list[tuple[re.Pattern, str]] = [
              (re.compile(r'github_pat_[A-Za-z0-9_]{20,}'), "github_pat"),
              (re.compile(r'apify_api_[A-Za-z0-9]{20,}'), "apify_api"),
              (re.compile(r'gho_[A-Za-z0-9]{20,}'), "gho"),
              (re.compile(r'ghp_[A-Za-z0-9]{20,}'), "ghp"),
              (re.compile(r'sk-[A-Za-z0-9]{16,}'), "sk"),
              (re.compile(r'AKIA[0-9A-Z]{16}'), "AKIA"),
              (re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}'), "xox"),
              (re.compile(r'AIza[A-Za-z0-9_\-]{20,}'), "AIza"),
              (re.compile(r'(?i)bearer\s+[A-Za-z0-9._\-]{20,}'), "bearer"),
          ]

          # Same identifier-name rule as dot_claude/hooks/executable_pre-bash-secret-guard.py
          # (_IS_SECRET): a secret WORD as a bounded component of an identifier.
          _SECRET_WORD = r'(?:API_?KEY|APIKEY|KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|BEARER)'
          _IS_SECRET_NAME = re.compile(r'(?i)(?:^|_)' + _SECRET_WORD + r'(?=_|$)')
          # NAME=VALUE assignment shape, e.g. pasted .env content, shell exports, or a
          # NAME=value mentioned mid-sentence in prose. Not anchored to line-start: the
          # secret-name filter (applied by the caller) is what keeps this from over-matching
          # ordinary code (`if x == y` etc. never matches — `==`/`!=` aren't `NAME=VALUE`).
          _ASSIGNMENT = re.compile(
              r"""\b([A-Za-z_][A-Za-z0-9_]*)\s*=\s*("[^"\n]*"|'[^'\n]*'|[A-Za-z0-9_./+@:-]+)"""
          )
          _SAFE_CODE_VALUES = {
              "lambda", "None", "True", "False", "len", "str", "int", "float",
              "bool", "list", "dict", "set", "tuple", "min", "max", "sum", "sorted",
          }


          def _literal_secret_value(name: str, value: str) -> bool:
              """Credential value, not ordinary code such as key=lambda or key=os.getenv(...)."""
              stripped = value.strip()
              if len(stripped.strip("\"'")) < 4:
                  return False
              if stripped[:1] in {"\"", "'"}:
                  return True
              if any(ch in stripped for ch in "()[]{}"):
                  return False
              if stripped in _SAFE_CODE_VALUES:
                  return False
              if re.fullmatch(r"[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+", stripped):
                  return False
              if name.isupper():
                  return True
              # A secret-named assignment plus a literal is sufficient evidence. Do not
              # impose an entropy threshold: short passwords such as secret=abc123 are
              # still secrets. False-positive redaction only affects the outbound review
              # copy and preserves source syntax; a false negative would disclose data.
              return True


          class ScrubError(RuntimeError):
              """Raised when the scrub itself cannot run — callers must treat this as a
              block (fail closed), never as permission to skip scrubbing."""


          @dataclass
          class ScrubResult:
              blocked: bool
              reasons: list[str] = field(default_factory=list)
              # Redact-don't-refuse (fr_636951d8ca87, ratified with the tilde fix
              # 2026-07-23): when every finding is a REDACTABLE class (1: secret-shaped
              # token, 2: credential-style assignment), `sanitized` carries the payload
              # with each secret VALUE masked, and send_sanitized() is True — an updated
              # caller sends the sanitized text instead of refusing. The value is what
              # must not leave; the review still happens. Measured motivation, both
              # directions: the credential-assignment rule refusing entire reviews is
              # what starved quorum on #188, and the destruction test showed one decoy
              # secret suppressing review of four real defects.
              # FAIL-CLOSED COMPATIBILITY: blocked stays True whenever anything was
              # found, so a caller that predates this field still refuses — a stale
              # caller can over-block but can never leak.
              sanitized: str | None = None
              redactions: list[str] = field(default_factory=list)

              def send_sanitized(self) -> bool:
                  """True iff findings exist and ALL are redactable — the caller may
                  send `sanitized` in place of the original payload. Classes 3 and 4
                  (sensitive roots, pre-publication doctrine) are never redactable:
                  the reference itself is the leak, so they remain hard refusals."""
                  return bool(self.redactions) and len(self.reasons) == len(self.redactions)


          def _load_policy(path: Path = POLICY_YAML) -> dict[str, Any]:
              if not path.is_file():
                  raise ScrubError(f"POLICY.yaml not found: {path}")
              with path.open(encoding="utf-8") as f:
                  policy = yaml.safe_load(f) or {}
              return policy.get("dispatch_scrub") or {}


          def _root_forms(entries: list[str]) -> list[str]:
              """Every form a declared root must match in: the DECLARED (tilde) form and
              the expanded absolute form. fr_fc17121b4530: POLICY.yaml declares roots as
              tilde form ("~/" + a dot-dir) but the old `_expanded_roots` matched only
              the expanded form, so all five sensitive roots passed the scrub in the
              form anyone actually writes them; only the absolute /Users/<user>/ form
              was caught. Declaration format and matching format must agree — match
              both. (Root literals in this file are assembled by concatenation so this
              source — embedded verbatim in ai-review-reusable.yml — never contains a
              contiguous root string that would make the scrub refuse its own PR.)"""
              forms: list[str] = []
              for e in entries:
                  if not e:
                      continue
                  expanded = os.path.expanduser(e)
                  forms.append(e)
                  if expanded != e:
                      forms.append(expanded)
              return forms


          def scrub_payload(text: str, *, provider: str = "", model: str = "", policy: dict[str, Any] | None = None) -> ScrubResult:
              """Scan `text` for the four deny classes. `provider`/`model` are accepted so
              every call site is uniform (R14) but do not change scrub behavior — the
              scrub is identical regardless of destination.

              Raises ScrubError if the scrub itself cannot execute (missing/malformed
              policy) — the caller must NOT send on this exception (fail closed)."""
              del provider, model  # uniform signature, deliberately no per-provider branching
              if policy is None:
                  policy = _load_policy()

              reasons: list[str] = []
              redactions: list[str] = []
              sanitized = text

              # Class 1 — secret-shaped tokens: REDACTABLE. The token value is masked in
              # `sanitized`; the reviewer still sees that a credential sat in the diff
              # (the redaction placeholder names the pattern) and can flag it, but the
              # value itself never leaves the estate.
              for pattern, label in SECRET_TOKEN_PATTERNS:
                  if pattern.search(text):
                      reason = f"secret-shaped token matched pattern '{label}'"
                      reasons.append(reason)
                      redactions.append(reason)
                      sanitized = pattern.sub(f"[REDACTED:{label}]", sanitized)

              # Class 2 — credential-style assignment: REDACTABLE (fr_636951d8ca87).
              # Only the VALUE is replaced; the variable name survives so the review
              # still sees the assignment shape.
              def _is_credential_assignment(m: re.Match) -> bool:
                  name, value = m.group(1), m.group(2)
                  # The literal regex intentionally stops before call/index punctuation;
                  # inspect the following source so `secret=load_from_vault(name)` is not
                  # mistaken for the bare literal `secret=load_from_vault`.
                  suffix = m.string[m.end():].lstrip()
                  if value[:1] not in {"\"", "'"} and suffix.startswith(("(", "[")):
                      return False
                  return bool(_IS_SECRET_NAME.search(name) and _literal_secret_value(name, value))

              def _mask_assignment(m: re.Match) -> str:
                  name, value = m.group(1), m.group(2)
                  if _is_credential_assignment(m):
                      quote = value[0] if value[:1] in {"\"", "'"} else "\""
                      if value[:1] in {"\"", "'"}:
                          return f"{name}={quote}[REDACTED:{name}]{quote}"
                      return f'{name}="[REDACTED:{name}]"'
                  return m.group(0)

              for match in _ASSIGNMENT.finditer(text):
                  name, value = match.group(1), match.group(2)
                  if _is_credential_assignment(match):
                      reason = f"credential-style assignment to secret-named variable '{name}'"
                      reasons.append(reason)
                      redactions.append(reason)
              if any(r.startswith("credential-style") for r in redactions):
                  sanitized = _ASSIGNMENT.sub(_mask_assignment, sanitized)

              # Classes 3/4 — NEVER redactable: the reference itself is the leak
              # (default-deny, OQ1). Matching covers the declared tilde form AND the
              # expanded absolute form (fr_fc17121b4530).
              for root in _root_forms(policy.get("sensitive_roots") or []):
                  if root in text:
                      reasons.append(f"payload references declared-sensitive path '{root}'")

              pub_markers = policy.get("pre_publication_markers") or []
              for marker in pub_markers:
                  if marker and marker in text:
                      reasons.append(f"payload references pre-publication doctrine marker '{marker}'")

              return ScrubResult(
                  blocked=bool(reasons),
                  reasons=reasons,
                  sanitized=sanitized if redactions else None,
                  redactions=redactions,
              )


          if __name__ == "__main__":
              import sys

              clean = "Summarize this public README section for the team."
              result = scrub_payload(clean)
              assert result.blocked is False, result
              assert clean == clean  # byte-identical passthrough — scrub never mutates

              # Fake fixture, assembled by concatenation so the SOURCE line never
              # contains a contiguous secret-shaped token — this file is embedded
              # verbatim in ai-review-reusable.yml, where a literal token would trip
              # the estate-gate secret scan (which has no allow-list, by design).
              dirty = "here is our key: " + "sk-" + "abcdEFGH12345678ijklmnop"
              result = scrub_payload(dirty)
              assert result.blocked is True, result
              assert "sk" in result.reasons[0]
              # Redactable: sendable in sanitized form, with the value masked.
              assert result.send_sanitized(), result
              assert "abcdEFGH12345678ijklmnop" not in (result.sanitized or ""), result.sanitized
              assert "[REDACTED:sk]" in (result.sanitized or ""), result.sanitized

              # Tilde form of a declared root must block (fr_fc17121b4530) and must NOT
              # be sendable — the reference itself is the leak.
              _root = "~/" + ".ssh/"   # concatenated — see _root_forms docstring
              tilde = scrub_payload(f"see {_root}id_rsa for details",
                                    policy={"sensitive_roots": [_root]})
              assert tilde.blocked and not tilde.send_sanitized(), tilde

              print("ok    dispatch_scrub self-check passed (clean pass-through, dirty redactable, tilde blocked)")
              sys.exit(0)
          # <<< VERBATIM harness/dispatch_scrub.py (sync-enforced)
          EMBED_DISPATCH_SCRUB
          cat > /tmp/aiwf/harness/ai_call_receipt.py <<'EMBED_AI_CALL_RECEIPT'
          # >>> VERBATIM harness/ai_call_receipt.py (sync-enforced)
          #!/usr/bin/env python3
          """Content-free, provider-neutral AI call receipts.

          The journal is telemetry, not model context. It records opaque identifiers,
          route facts, usage and bounded provider scalars; prompts and responses have no
          representation in this schema.
          """
          from __future__ import annotations

          import argparse
          import fcntl
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          import urllib.error
          import uuid
          from collections import Counter
          from contextlib import contextmanager
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, IO, Iterable, Iterator, Mapping, Sequence

          SCHEMA = "ai-call-receipt/v1"
          FINGERPRINT_SCHEMA = "opaque-evidence-fingerprint/v1"

          FAILURE_CLASSES = frozenset(
              {
                  "authentication",
                  "authorization",
                  "quota",
                  "rate_limit",
                  "timeout",
                  "connection",
                  "provider_4xx",
                  "provider_5xx",
                  "response_invalid",
                  "response_refused",
                  "context_overflow",
                  "scrub_blocked",
                  "dispatch_blocked",
                  "interrupted",
                  "unknown",
              }
          )
          TERMINAL_STATUSES = frozenset(
              {
                  "success",
                  "failed",
                  "response_invalid",
                  "response_refused",
                  "dispatch_blocked",
              }
          )
          EVENTS = frozenset({"dispatch_started", "attempt_terminal", "dispatch_blocked"})
          PROVIDER_METADATA_FIELDS = frozenset(
              {
                  "http_status",
                  "request_id",
                  "response_id",
                  "finish_reason",
                  "stop_reason",
                  "idempotency_id",
                  "cache_status",
                  "service_tier",
                  "region",
                  "revalidation_grant_id",
              }
          )
          USAGE_FIELDS = frozenset(
              {
                  "input_tokens",
                  "output_tokens",
                  "total_tokens",
                  "cache_read_tokens",
                  "cache_write_tokens",
                  "reasoning_tokens",
              }
          )
          SCOPE_FIELDS = frozenset(
              {"seat", "surface", "delivery_unit", "project", "repository", "environment"}
          )
          ROUTE_FIELDS = frozenset({"provider", "route", "model"})
          FINGERPRINT_INPUT_FIELDS = (
              "evidence_digests",
              "template_version",
              "tool_schema_version",
              "route_config_version",
              "canonical_envelope_version",
              "scrub_policy_version",
              "digest_algorithm_version",
          )
          FINGERPRINT_FIELDS = frozenset(
              {
                  "schema",
                  "value",
                  "included_fields",
                  "template_version",
                  "tool_schema_version",
                  "route_config_version",
                  "canonical_envelope_version",
                  "scrub_policy_version",
                  "digest_algorithm_version",
              }
          )
          COST_FIELDS = frozenset(
              {
                  "currency",
                  "amount",
                  "status",
                  "price_source",
                  "price_version",
                  "effective_at",
              }
          )
          TOP_LEVEL_FIELDS = frozenset(
              {
                  "schema",
                  "event_id",
                  "logical_call_id",
                  "attempt_id",
                  "previous_event_id",
                  "timestamp",
                  "event",
                  "status",
                  "failure_class",
                  "requested",
                  "actual",
                  "scope",
                  "fingerprint",
                  "usage",
                  "cost_estimate",
                  "provider_metadata",
                  "previous_record_hash",
                  "record_hash",
              }
          )
          _OPAQUE_DIGEST = re.compile(r"^[a-z0-9][a-z0-9_-]{1,31}:[0-9a-f]{32,128}$")
          _OPAQUE_ID = re.compile(r"^(call|attempt|event)_[0-9a-f]{32}$")
          _RECORD_HASH = re.compile(r"^sha256:[0-9a-f]{64}$")
          _FORBIDDEN_KEY_PARTS = (
              "prompt",
              "response_body",
              "response_content",
              "content",
              "message",
              "authorization",
              "credential",
              "api_key",
              "secret",
              "personal_name",
          )
          _MAX_STRING = 256
          DEFAULT_JOURNAL = (
              Path.home()
              / ".local"
              / "state"
              / "amplified"
              / "ai-call-receipts"
              / "receipts.jsonl"
          )
          DEFAULT_USAGE_ALIASES = {
              "input_tokens": "prompt_tokens",
              "output_tokens": "completion_tokens",
              "total_tokens": "total_tokens",
              "cache_read_tokens": "prompt_cache_hit_tokens",
              "cache_write_tokens": "prompt_cache_miss_tokens",
              "reasoning_tokens": "reasoning_tokens",
          }


          class ReceiptError(RuntimeError):
              """Base receipt error."""


          class ReceiptValidationError(ReceiptError):
              """The record is not in the closed content-free schema."""


          class ReceiptSecurityError(ReceiptError):
              """Journal ownership, mode, or no-follow rules were violated."""


          class ReceiptDispatchBlocked(ReceiptError):
              """Governed failure budget refused another external attempt."""


          def default_journal_path(*, legacy_env: str | None = None) -> Path:
              """Return the configured journal, optionally colocated with a legacy ledger."""
              configured = os.environ.get("AI_CALL_RECEIPT_JOURNAL")
              if configured:
                  return Path(configured).expanduser()
              if legacy_env and (legacy := os.environ.get(legacy_env)):
                  return Path(legacy).expanduser().with_name("ai-call-receipts.jsonl")
              return DEFAULT_JOURNAL


          def scope_from_env(
              *,
              surface: str,
              delivery_unit: str,
              project: str = "unscoped",
              repository: str = "amplified-fleet-config",
              environment: str = "local",
          ) -> dict[str, str]:
              """Build the closed attribution scope from environment overrides."""
              defaults = {
                  "seat": "codex",
                  "surface": surface,
                  "delivery_unit": delivery_unit,
                  "project": project,
                  "repository": repository,
                  "environment": environment,
              }
              return {
                  field: os.environ.get(f"AMPLIFIED_{field.upper()}", value)
                  for field, value in defaults.items()
              }


          def fingerprint_input(
              *,
              template_version: str,
              tool_schema_version: str,
              route_config_version: str,
              evidence_digests: Sequence[str] | None = None,
              canonical_envelope_version: str = "ai-call-envelope/v1",
              scrub_policy_version: str = "dispatch-scrub/current",
              digest_algorithm_version: str = "sha256/v1",
          ) -> dict[str, object]:
              """Build the canonical fingerprint input without accepting raw evidence."""
              return {
                  "evidence_digests": list(evidence_digests or ()),
                  "template_version": template_version,
                  "tool_schema_version": tool_schema_version,
                  "route_config_version": route_config_version,
                  "canonical_envelope_version": canonical_envelope_version,
                  "scrub_policy_version": scrub_policy_version,
                  "digest_algorithm_version": digest_algorithm_version,
              }


          def classify_transport_failure(
              exc: Exception, *, invalid_exceptions: tuple[type[Exception], ...] = ()
          ) -> str:
              """Classify HTTP and transport failures into the receipt vocabulary."""
              if isinstance(exc, urllib.error.HTTPError):
                  if exc.code == 401:
                      return "authentication"
                  if exc.code == 403:
                      return "authorization"
                  if exc.code == 429:
                      return "rate_limit"
                  return "provider_5xx" if exc.code >= 500 else "provider_4xx"
              if isinstance(exc, TimeoutError):
                  return "timeout"
              if isinstance(exc, urllib.error.URLError):
                  return "timeout" if "timed out" in str(exc).lower() else "connection"
              if invalid_exceptions and isinstance(exc, invalid_exceptions):
                  return "response_invalid"
              return "unknown"


          def normalized_usage(
              value: object,
              aliases: Mapping[str, str] = DEFAULT_USAGE_ALIASES,
              *,
              nested: bool = True,
          ) -> dict[str, int]:
              """Normalize non-negative provider token counters through explicit aliases."""
              source: object = value
              if nested:
                  source = value.get("usage") if isinstance(value, Mapping) else None
              if not isinstance(source, Mapping):
                  return {}
              return {
                  target: source[provider_field]
                  for target, provider_field in aliases.items()
                  if isinstance(source.get(provider_field), int)
                  and not isinstance(source[provider_field], bool)
                  and source[provider_field] >= 0
              }


          def unknown_cost(*, price_source: str, price_version: str) -> dict[str, object]:
              """Return explicit unknown-cost provenance; unknown is never represented as zero."""
              return {
                  "currency": "USD",
                  "amount": None,
                  "status": "unknown",
                  "price_source": price_source,
                  "price_version": price_version,
                  "effective_at": price_version,
              }


          def _opaque_id(kind: str) -> str:
              return f"{kind}_{uuid.uuid4().hex}"


          def _bounded_string(value: Any, field: str, *, nullable: bool = False) -> str | None:
              if value is None and nullable:
                  return None
              if not isinstance(value, str) or not value or len(value) > _MAX_STRING:
                  raise ReceiptValidationError(f"{field} must be a non-empty bounded string")
              if any(ord(char) < 32 for char in value):
                  raise ReceiptValidationError(f"{field} contains control characters")
              return value


          def _closed_mapping(
              value: Any, allowed: frozenset[str], field: str
          ) -> Mapping[str, Any]:
              if not isinstance(value, Mapping):
                  raise ReceiptValidationError(f"{field} must be an object")
              unknown = set(value) - allowed
              if unknown:
                  raise ReceiptValidationError(f"{field} contains unknown fields: {sorted(unknown)}")
              return value


          def _reject_forbidden_keys(value: Any, path: str = "record") -> None:
              if isinstance(value, Mapping):
                  for key, child in value.items():
                      lowered = str(key).lower()
                      if lowered == "name" or any(part in lowered for part in _FORBIDDEN_KEY_PARTS):
                          raise ReceiptValidationError(f"{path}.{key} is content or secret bearing")
                      _reject_forbidden_keys(child, f"{path}.{key}")
              elif isinstance(value, (list, tuple)):
                  for index, child in enumerate(value):
                      _reject_forbidden_keys(child, f"{path}[{index}]")


          def exact_fingerprint(
              *,
              evidence_digests: Sequence[str],
              template_version: str,
              tool_schema_version: str,
              route_config_version: str,
              canonical_envelope_version: str,
              scrub_policy_version: str,
              digest_algorithm_version: str,
          ) -> str:
              """Fingerprint caller-supplied opaque evidence digests and config versions.

              Raw evidence is intentionally not accepted, inspected, or hashed here.
              Digest order is canonicalized because the evidence set is unordered.
              """
              if (
                  not isinstance(evidence_digests, Sequence)
                  or isinstance(evidence_digests, (str, bytes))
                  or not evidence_digests
              ):
                  raise ReceiptValidationError("at least one opaque evidence digest is required")
              canonical_digests: list[str] = []
              for digest in evidence_digests:
                  if not isinstance(digest, str) or not _OPAQUE_DIGEST.fullmatch(digest):
                      raise ReceiptValidationError(
                          "each opaque evidence digest must be algorithm:lowercase-hex"
                      )
                  canonical_digests.append(digest)
              versions = {
                  "template_version": _bounded_string(template_version, "template_version"),
                  "tool_schema_version": _bounded_string(
                      tool_schema_version, "tool_schema_version"
                  ),
                  "route_config_version": _bounded_string(
                      route_config_version, "route_config_version"
                  ),
                  "canonical_envelope_version": _bounded_string(
                      canonical_envelope_version, "canonical_envelope_version"
                  ),
                  "scrub_policy_version": _bounded_string(
                      scrub_policy_version, "scrub_policy_version"
                  ),
                  "digest_algorithm_version": _bounded_string(
                      digest_algorithm_version, "digest_algorithm_version"
                  ),
              }
              envelope = {
                  "schema": FINGERPRINT_SCHEMA,
                  "evidence_digests": sorted(set(canonical_digests)),
                  **versions,
              }
              encoded = json.dumps(
                  envelope, sort_keys=True, separators=(",", ":"), ensure_ascii=True
              ).encode("ascii")
              return f"sha256:{hashlib.sha256(encoded).hexdigest()}"


          def _fingerprint_record(data: Mapping[str, Any]) -> dict[str, Any]:
              unknown = set(data) - set(FINGERPRINT_INPUT_FIELDS)
              if unknown or set(data) != set(FINGERPRINT_INPUT_FIELDS):
                  raise ReceiptValidationError(
                      f"fingerprint_input must contain exactly {list(FINGERPRINT_INPUT_FIELDS)}"
                  )
              evidence_digests = data["evidence_digests"]
              if not isinstance(evidence_digests, Sequence) or isinstance(
                  evidence_digests, (str, bytes)
              ):
                  raise ReceiptValidationError("evidence_digests must be a sequence")
              # Missing caller-supplied evidence disables exact reuse, but must not disable
              # receipting of the underlying call (KTD 3).
              fingerprint = exact_fingerprint(**data) if evidence_digests else None
              return {
                  "schema": FINGERPRINT_SCHEMA,
                  "value": fingerprint,
                  "included_fields": list(FINGERPRINT_INPUT_FIELDS),
                  **{field: data[field] for field in FINGERPRINT_INPUT_FIELDS if field != "evidence_digests"},
              }


          def _usage(value: Mapping[str, Any] | None) -> dict[str, int | None]:
              supplied = {} if value is None else _closed_mapping(value, USAGE_FIELDS, "usage")
              result: dict[str, int | None] = {}
              for field in sorted(USAGE_FIELDS):
                  item = supplied.get(field)
                  if item is not None and (not isinstance(item, int) or isinstance(item, bool) or item < 0):
                      raise ReceiptValidationError(f"usage.{field} must be a non-negative integer or null")
                  result[field] = item
              if result["total_tokens"] is None:
                  inputs, outputs = result["input_tokens"], result["output_tokens"]
                  if inputs is not None and outputs is not None:
                      result["total_tokens"] = inputs + outputs
              return result


          def _route(provider: Any, route: Any, model: Any, field: str) -> dict[str, str | None]:
              return {
                  "provider": _bounded_string(provider, f"{field}.provider", nullable=True),
                  "route": _bounded_string(route, f"{field}.route", nullable=True),
                  "model": _bounded_string(model, f"{field}.model", nullable=True),
              }


          def validate_scope(value: Mapping[str, Any]) -> dict[str, str]:
              """Return the canonical closed receipt scope."""
              supplied = _closed_mapping(value, SCOPE_FIELDS, "scope")
              if set(supplied) != SCOPE_FIELDS:
                  raise ReceiptValidationError(f"scope requires {sorted(SCOPE_FIELDS)}")
              return {field: _bounded_string(supplied[field], f"scope.{field}") for field in sorted(SCOPE_FIELDS)}  # type: ignore[misc]


          def _provider_metadata(value: Mapping[str, Any] | None) -> dict[str, Any]:
              supplied = (
                  {} if value is None else _closed_mapping(value, PROVIDER_METADATA_FIELDS, "provider_metadata")
              )
              result: dict[str, Any] = {}
              for field, item in supplied.items():
                  if isinstance(item, bool) or item is None:
                      result[field] = item
                  elif isinstance(item, int) and not isinstance(item, bool):
                      result[field] = item
                  elif isinstance(item, float):
                      if item != item or item in (float("inf"), float("-inf")):
                          raise ReceiptValidationError(f"provider_metadata.{field} must be finite")
                      result[field] = item
                  elif isinstance(item, str):
                      result[field] = _bounded_string(item, f"provider_metadata.{field}")
                  else:
                      raise ReceiptValidationError(
                          f"provider_metadata.{field} must be an allowlisted scalar"
                      )
              return result


          def _cost(value: Mapping[str, Any] | None) -> dict[str, Any] | None:
              if value is None:
                  return None
              supplied = _closed_mapping(value, COST_FIELDS, "cost_estimate")
              if set(supplied) != COST_FIELDS:
                  raise ReceiptValidationError(f"cost_estimate requires {sorted(COST_FIELDS)}")
              if supplied["status"] not in {"estimated", "unknown"}:
                  raise ReceiptValidationError("cost_estimate.status must be estimated or unknown")
              amount = supplied["amount"]
              if amount is not None and (
                  isinstance(amount, bool) or not isinstance(amount, (int, float)) or amount < 0
              ):
                  raise ReceiptValidationError("cost_estimate.amount must be non-negative or null")
              if supplied["status"] == "unknown" and amount is not None:
                  raise ReceiptValidationError("unknown cost cannot have an amount")
              return {
                  field: (
                      _bounded_string(supplied[field], f"cost_estimate.{field}")
                      if field != "amount"
                      else amount
                  )
                  for field in sorted(COST_FIELDS)
              }


          def new_record(
              *,
              event: str,
              requested_provider: str,
              requested_route: str,
              requested_model: str,
              scope: Mapping[str, Any],
              fingerprint_input: Mapping[str, Any],
              logical_call_id: str | None = None,
              attempt_id: str | None = None,
              previous_event_id: str | None = None,
              actual_provider: str | None = None,
              actual_route: str | None = None,
              actual_model: str | None = None,
              status: str | None = None,
              failure_class: str | None = None,
              usage: Mapping[str, Any] | None = None,
              cost_estimate: Mapping[str, Any] | None = None,
              provider_metadata: Mapping[str, Any] | None = None,
          ) -> dict[str, Any]:
              """Build and validate one immutable lifecycle record."""
              if event not in EVENTS:
                  raise ReceiptValidationError(f"event must be one of {sorted(EVENTS)}")
              if event == "dispatch_started":
                  status = status or "started"
              elif event == "dispatch_blocked":
                  status = status or "dispatch_blocked"
                  failure_class = failure_class or "dispatch_blocked"
              record = {
                  "schema": SCHEMA,
                  "event_id": _opaque_id("event"),
                  "logical_call_id": logical_call_id or _opaque_id("call"),
                  "attempt_id": attempt_id or _opaque_id("attempt"),
                  "previous_event_id": previous_event_id,
                  "timestamp": datetime.now(timezone.utc).isoformat(timespec="microseconds"),
                  "event": event,
                  "status": status,
                  "failure_class": failure_class,
                  "requested": _route(
                      requested_provider, requested_route, requested_model, "requested"
                  ),
                  "actual": _route(actual_provider, actual_route, actual_model, "actual"),
                  "scope": validate_scope(scope),
                  "fingerprint": _fingerprint_record(fingerprint_input),
                  "usage": _usage(usage),
                  "cost_estimate": _cost(cost_estimate),
                  "provider_metadata": _provider_metadata(provider_metadata),
                  "previous_record_hash": None,
                  "record_hash": None,
              }
              validate_record(record)
              return record


          def start_attempt(
              journal: str | os.PathLike[str],
              *,
              requested_provider: str,
              requested_route: str,
              requested_model: str,
              scope: Mapping[str, Any],
              fingerprint: Mapping[str, Any],
              logical_call_id: str | None = None,
              provider_metadata: Mapping[str, Any] | None = None,
              writer: Any = None,
          ) -> dict[str, Any]:
              """Append an unconditional lifecycle start without hidden admission policy.

              Governed callers that need attempt admission must use ``reserve_attempt``.
              """
              metadata = dict(provider_metadata or {})
              started = new_record(
                  event="dispatch_started",
                  requested_provider=requested_provider,
                  requested_route=requested_route,
                  requested_model=requested_model,
                  logical_call_id=logical_call_id,
                  scope=scope,
                  fingerprint_input=fingerprint,
                  provider_metadata=metadata,
              )
              (writer or append_record)(journal, started)
              return started


          def terminal_record(
              started: Mapping[str, Any],
              *,
              status: str,
              failure_class: str | None = None,
              actual_provider: str | None = None,
              actual_route: str | None = None,
              actual_model: str | None = None,
              usage: Mapping[str, Any] | None = None,
              cost_estimate: Mapping[str, Any],
              provider_metadata: Mapping[str, Any] | None = None,
              event: str = "attempt_terminal",
          ) -> dict[str, Any]:
              """Normalize one terminal without mutating the journal."""
              validate_record(started)
              requested = started["requested"]
              terminal_metadata = dict(provider_metadata or {})
              for field in ("idempotency_id", "revalidation_grant_id"):
                  value = started.get("provider_metadata", {}).get(field)
                  if value is not None:
                      terminal_metadata.setdefault(field, value)
              terminal = new_record(
                  event=event,
                  logical_call_id=started["logical_call_id"],
                  attempt_id=started["attempt_id"],
                  previous_event_id=started["event_id"],
                  requested_provider=requested["provider"],
                  requested_route=requested["route"],
                  requested_model=requested["model"],
                  actual_provider=actual_provider,
                  actual_route=actual_route,
                  actual_model=actual_model,
                  scope=started["scope"],
                  fingerprint_input={
                      "evidence_digests": [],
                      **{
                          field: started["fingerprint"][field]
                          for field in FINGERPRINT_INPUT_FIELDS
                          if field != "evidence_digests"
                      },
                  },
                  status=status,
                  failure_class=failure_class,
                  usage=usage,
                  cost_estimate=cost_estimate,
                  provider_metadata=terminal_metadata,
              )
              terminal["fingerprint"] = started["fingerprint"]
              validate_record(terminal)
              return terminal


          def finish_attempt(
              journal: str | os.PathLike[str],
              started: Mapping[str, Any],
              *,
              status: str,
              failure_class: str | None = None,
              actual_provider: str | None = None,
              actual_route: str | None = None,
              actual_model: str | None = None,
              usage: Mapping[str, Any] | None = None,
              cost_estimate: Mapping[str, Any],
              provider_metadata: Mapping[str, Any] | None = None,
              event: str = "attempt_terminal",
          ) -> dict[str, Any]:
              """Normalize and append a terminal linked to its exact start."""
              terminal = terminal_record(
                  started,
                  status=status,
                  failure_class=failure_class,
                  actual_provider=actual_provider,
                  actual_route=actual_route,
                  actual_model=actual_model,
                  usage=usage,
                  cost_estimate=cost_estimate,
                  provider_metadata=provider_metadata,
                  event=event,
              )
              append_record(journal, terminal)
              return terminal


          def validate_record(record: Mapping[str, Any]) -> None:
              """Validate the closed schema and its privacy-preserving scalar boundaries."""
              if not isinstance(record, Mapping):
                  raise ReceiptValidationError("record must be an object")
              _reject_forbidden_keys(record)
              unknown = set(record) - TOP_LEVEL_FIELDS
              missing = TOP_LEVEL_FIELDS - set(record)
              if unknown or missing:
                  raise ReceiptValidationError(
                      f"record fields mismatch; unknown={sorted(unknown)} missing={sorted(missing)}"
                  )
              if record["schema"] != SCHEMA:
                  raise ReceiptValidationError(f"schema must be {SCHEMA}")
              for field in ("event_id", "logical_call_id", "attempt_id"):
                  if not isinstance(record[field], str) or not _OPAQUE_ID.fullmatch(record[field]):
                      raise ReceiptValidationError(f"{field} is not an opaque receipt ID")
              previous = record["previous_event_id"]
              if previous is not None and (
                  not isinstance(previous, str) or not _OPAQUE_ID.fullmatch(previous)
              ):
                  raise ReceiptValidationError("previous_event_id is not an opaque event ID")
              _bounded_string(record["timestamp"], "timestamp")
              if record["event"] not in EVENTS:
                  raise ReceiptValidationError(f"event must be one of {sorted(EVENTS)}")
              status = record["status"]
              if record["event"] == "dispatch_started":
                  if status != "started" or previous is not None or record["failure_class"] is not None:
                      raise ReceiptValidationError("dispatch_started must be unlinked started state")
              else:
                  if status not in TERMINAL_STATUSES or previous is None:
                      raise ReceiptValidationError("terminal events require terminal status and previous_event_id")
                  if status == "success":
                      if record["failure_class"] is not None:
                          raise ReceiptValidationError("success cannot have failure_class")
                  elif record["failure_class"] not in FAILURE_CLASSES:
                      raise ReceiptValidationError(
                          f"failure_class must be one of {sorted(FAILURE_CLASSES)}"
                      )
              for field in ("requested", "actual"):
                  route = _closed_mapping(record[field], ROUTE_FIELDS, field)
                  for route_field in ROUTE_FIELDS:
                      _bounded_string(
                          route.get(route_field),
                          f"{field}.{route_field}",
                          nullable=field == "actual",
                      )
              validate_scope(record["scope"])
              fingerprint = _closed_mapping(record["fingerprint"], FINGERPRINT_FIELDS, "fingerprint")
              if set(fingerprint) != FINGERPRINT_FIELDS:
                  raise ReceiptValidationError("fingerprint record is incomplete")
              if fingerprint["schema"] != FINGERPRINT_SCHEMA:
                  raise ReceiptValidationError("fingerprint schema is invalid")
              if fingerprint["value"] is not None and (
                  not isinstance(fingerprint["value"], str)
                  or not _OPAQUE_DIGEST.fullmatch(fingerprint["value"])
              ):
                  raise ReceiptValidationError("fingerprint value is invalid")
              if fingerprint["included_fields"] != list(FINGERPRINT_INPUT_FIELDS):
                  raise ReceiptValidationError("fingerprint included_fields are not canonical")
              _usage(record["usage"])
              _cost(record["cost_estimate"])
              _provider_metadata(record["provider_metadata"])
              for field in ("previous_record_hash", "record_hash"):
                  value = record[field]
                  if value is not None and (
                      not isinstance(value, str) or not _RECORD_HASH.fullmatch(value)
                  ):
                      raise ReceiptValidationError(f"{field} is not a canonical record hash")
              if record["previous_record_hash"] is not None and record["record_hash"] is None:
                  raise ReceiptValidationError("previous_record_hash requires record_hash")


          def _record_digest(record: Mapping[str, Any]) -> str:
              unsigned = dict(record)
              unsigned["record_hash"] = None
              encoded = json.dumps(
                  unsigned, sort_keys=True, separators=(",", ":"), ensure_ascii=True
              ).encode("ascii")
              return "sha256:" + hashlib.sha256(encoded).hexdigest()


          def _last_record_hash(path: Path) -> str | None:
              if not path.exists() or path.stat().st_size == 0:
                  return None
              fd = _secure_open(path, os.O_RDONLY)
              try:
                  with os.fdopen(fd, "r", encoding="ascii") as stream:
                      last = None
                      for line in stream:
                          if line.strip():
                              last = json.loads(line)
              finally:
                  # os.fdopen owns and closes fd.
                  pass
              if not isinstance(last, Mapping):
                  raise ReceiptValidationError(f"{path}: final receipt is invalid")
              validate_record(last)
              expected = _record_digest(last)
              if last["record_hash"] != expected:
                  raise ReceiptValidationError(f"{path}: final receipt hash mismatch")
              return expected


          def _assert_secure_fd(fd: int, path: Path) -> None:
              details = os.fstat(fd)
              if details.st_uid != os.getuid():
                  raise ReceiptSecurityError(f"{path} owner is not the current user")
              if not stat.S_ISREG(details.st_mode):
                  raise ReceiptSecurityError(f"{path} is not a regular file")
              if stat.S_IMODE(details.st_mode) != 0o600:
                  raise ReceiptSecurityError(f"{path} must have mode 0600")


          def _secure_directory(path: Path) -> None:
              if path.exists():
                  if path.is_symlink() or not path.is_dir():
                      raise ReceiptSecurityError(f"{path} must be a real directory")
                  details = path.stat()
                  if details.st_uid != os.getuid():
                      raise ReceiptSecurityError(f"{path} owner is not the current user")
                  if stat.S_IMODE(details.st_mode) != 0o700:
                      raise ReceiptSecurityError(f"{path} must have mode 0700")
                  return
              # Multiple dispatch processes can create the journal domain concurrently.
              path.mkdir(parents=True, mode=0o700, exist_ok=True)
              os.chmod(path, 0o700)
              details = path.stat()
              if path.is_symlink() or not path.is_dir() or details.st_uid != os.getuid():
                  raise ReceiptSecurityError(f"{path} is not a current-user directory")


          def _secure_open(path: Path, flags: int) -> int:
              nofollow = getattr(os, "O_NOFOLLOW", 0)
              try:
                  fd = os.open(path, flags | nofollow, 0o600)
              except OSError as exc:
                  raise ReceiptSecurityError(f"secure open failed for {path}: {exc}") from exc
              try:
                  _assert_secure_fd(fd, path)
              except Exception:
                  os.close(fd)
                  raise
              return fd


          @contextmanager
          def secure_regular_file(
              path: str | os.PathLike[str],
              *,
              binary: bool = False,
          ) -> Iterator[IO[Any]]:
              """Open an owner-only regular file through its validated descriptor."""
              regular_path = Path(path)
              fd = _secure_open(regular_path, os.O_RDONLY)
              mode = "rb" if binary else "r"
              try:
                  with os.fdopen(
                      fd,
                      mode,
                      **({} if binary else {"encoding": "ascii"}),
                  ) as stream:
                      yield stream
              except Exception:
                  # fdopen owns fd after successful construction.
                  raise


          def _rotate_locked(path: Path, max_bytes: int, retention: int) -> None:
              if max_bytes <= 0 or retention < 0:
                  raise ReceiptValidationError("rotation bounds must be positive")
              if not path.exists() or path.stat().st_size < max_bytes:
                  return
              for index in range(retention, 0, -1):
                  source = path.with_name(f"{path.name}.{index}")
                  if index == retention and source.exists():
                      source.unlink()
                  previous = path if index == 1 else path.with_name(f"{path.name}.{index - 1}")
                  if previous.exists():
                      if previous.is_symlink():
                          raise ReceiptSecurityError("rotation source cannot be a symlink")
                      previous.replace(source)


          @contextmanager
          def _journal_owner_lock(
              path: str | os.PathLike[str],
          ) -> Iterator[Path]:
              """Hold the journal's fixed-owner lock across one state transition."""
              journal = Path(path)
              _secure_directory(journal.parent)
              lock_path = journal.with_name(f".{journal.name}.lock")
              lock_fd = _secure_open(lock_path, os.O_WRONLY | os.O_APPEND | os.O_CREAT)
              try:
                  fcntl.flock(lock_fd, fcntl.LOCK_EX)
                  if journal.is_symlink():
                      raise ReceiptSecurityError(f"{journal} cannot be a symlink")
                  if journal.exists():
                      check_fd = _secure_open(journal, os.O_RDONLY)
                      os.close(check_fd)
                  yield journal
              finally:
                  fcntl.flock(lock_fd, fcntl.LOCK_UN)
                  os.close(lock_fd)


          def _append_record_locked(
              journal: Path,
              record: Mapping[str, Any],
              *,
              max_bytes: int = 8 * 1024 * 1024,
              retention: int = 3,
          ) -> None:
              """Append one record while ``_journal_owner_lock`` is held."""
              validate_record(record)
              previous_record_hash = _last_record_hash(journal)
              _rotate_locked(journal, max_bytes, retention)
              fd = _secure_open(journal, os.O_WRONLY | os.O_APPEND | os.O_CREAT)
              try:
                  stored_record = dict(record)
                  stored_record["previous_record_hash"] = previous_record_hash
                  stored_record["record_hash"] = _record_digest(stored_record)
                  encoded = (
                      json.dumps(
                          stored_record, sort_keys=True, separators=(",", ":"), ensure_ascii=True
                      )
                      + "\n"
                  ).encode("ascii")
                  written = os.write(fd, encoded)
                  if written != len(encoded):
                      raise ReceiptError("receipt append was incomplete")
                  os.fsync(fd)
                  if isinstance(record, dict):
                      record["previous_record_hash"] = stored_record["previous_record_hash"]
                      record["record_hash"] = stored_record["record_hash"]
              finally:
                  os.close(fd)


          def append_record(
              path: str | os.PathLike[str],
              record: Mapping[str, Any],
              *,
              max_bytes: int = 8 * 1024 * 1024,
              retention: int = 3,
          ) -> None:
              """Atomically append a validated JSON line under a fixed-owner lock."""
              validate_record(record)
              with _journal_owner_lock(path) as journal:
                  _append_record_locked(
                      journal,
                      record,
                      max_bytes=max_bytes,
                      retention=retention,
                  )


          def reserve_attempt(
              journal: str | os.PathLike[str],
              *,
              requested_provider: str,
              requested_route: str,
              requested_model: str,
              scope: Mapping[str, Any],
              fingerprint: Mapping[str, Any],
              objective_id: str,
              attempt: int,
              policy_version: str,
              failure_ceiling: int,
              logical_call_id: str | None = None,
          ) -> dict[str, Any]:
              """Atomically admit and append one explicitly governed attempt start.

              The decision and append share the journal owner lock. Policy inputs are
              mandatory; environment variables and implicit defaults are never read.
              """
              governed_scope = validate_scope(scope)
              objective = _bounded_string(objective_id, "objective_id")
              policy = _bounded_string(policy_version, "policy_version")
              if (
                  not isinstance(attempt, int)
                  or isinstance(attempt, bool)
                  or not isinstance(failure_ceiling, int)
                  or isinstance(failure_ceiling, bool)
                  or not 1 <= failure_ceiling <= 100
                  or not 1 <= attempt <= failure_ceiling
              ):
                  raise ReceiptDispatchBlocked("declared attempt exceeds failure ceiling")
              with _journal_owner_lock(journal) as journal_path:
                  started = new_record(
                      event="dispatch_started",
                      requested_provider=requested_provider,
                      requested_route=requested_route,
                      requested_model=requested_model,
                      logical_call_id=logical_call_id,
                      scope=governed_scope,
                      fingerprint_input=fingerprint,
                      provider_metadata={"idempotency_id": objective},
                  )
                  prior = read_records(journal_path) if journal_path.exists() else []
                  from attempt_control import decide_attempt

                  decision = decide_attempt(
                      prior,
                      fingerprint=started["fingerprint"]["value"],
                      objective_id=objective,
                      route=requested_route,
                      scope=governed_scope,
                      policy_version=policy,
                      failure_ceiling=failure_ceiling,
                  )
                  prior_attempts = decision["prior_attempts"]
                  if (
                      decision["action"] != "dispatch"
                      or len(prior_attempts) >= failure_ceiling
                      or attempt != len(prior_attempts) + 1
                  ):
                      raise ReceiptDispatchBlocked("atomic attempt reservation refused")
                  _append_record_locked(journal_path, started)
                  return started


          def read_records(
              path: str | os.PathLike[str],
              *,
              provider: str | None = None,
              status: str | None = None,
              logical_call_id: str | None = None,
          ) -> list[dict[str, Any]]:
              """Read and validate owner-only records with optional exact filters."""
              journal = Path(path)
              with secure_regular_file(journal) as stream:
                  records = []
                  previous_record_hash = None
                  for line_number, line in enumerate(stream, 1):
                      try:
                          record = json.loads(line)
                          validate_record(record)
                          expected = _record_digest(record)
                          if record["record_hash"] != expected:
                              raise ReceiptValidationError("record hash mismatch")
                          if (
                              previous_record_hash is not None
                              and record["previous_record_hash"] != previous_record_hash
                          ):
                              raise ReceiptValidationError("record hash chain mismatch")
                          previous_record_hash = expected
                      except (json.JSONDecodeError, ReceiptValidationError) as exc:
                          raise ReceiptValidationError(
                              f"{journal}:{line_number}: invalid receipt: {exc}"
                          ) from exc
                      if provider is not None and record["requested"]["provider"] != provider:
                          continue
                      if status is not None and record["status"] != status:
                          continue
                      if (
                          logical_call_id is not None
                          and record["logical_call_id"] != logical_call_id
                      ):
                          continue
                      records.append(record)
                  return records


          def project_attempts(records: Iterable[Mapping[str, Any]]) -> list[dict[str, Any]]:
              """Pair starts and terminals; an unpaired start is explicitly unknown."""
              ordered = sorted(records, key=lambda item: item["timestamp"])
              by_attempt: dict[str, dict[str, Mapping[str, Any] | None]] = {}
              for record in ordered:
                  validate_record(record)
                  item = by_attempt.setdefault(record["attempt_id"], {"start": None, "terminal": None})
                  if record["event"] == "dispatch_started":
                      if item["start"] is not None:
                          raise ReceiptValidationError("attempt has duplicate dispatch_started records")
                      item["start"] = record
                  else:
                      if item["terminal"] is not None:
                          raise ReceiptValidationError("attempt has duplicate terminal records")
                      item["terminal"] = record
              projected = []
              logical_call_indexes: Counter[str] = Counter()
              fingerprint_dispatches: Counter[tuple[tuple[tuple[str, str], ...], str]] = Counter()
              for attempt_id, pair in by_attempt.items():
                  start, terminal = pair["start"], pair["terminal"]
                  if start is None:
                      raise ReceiptValidationError("terminal receipt has no dispatch_started record")
                  if terminal is not None:
                      if terminal["previous_event_id"] != start["event_id"]:
                          raise ReceiptValidationError("terminal receipt does not link to its start")
                      if terminal["logical_call_id"] != start["logical_call_id"]:
                          raise ReceiptValidationError("terminal changed logical_call_id")
                  source = terminal or start
                  logical_call_indexes[start["logical_call_id"]] += 1
                  fingerprint = start["fingerprint"]["value"]
                  fingerprint_key = (tuple(sorted(start["scope"].items())), fingerprint)
                  if fingerprint is not None:
                      fingerprint_dispatches[fingerprint_key] += 1
                  projected.append(
                      {
                          "logical_call_id": start["logical_call_id"],
                          "attempt_id": attempt_id,
                          "provider": start["requested"]["provider"],
                          "outcome": terminal["status"] if terminal is not None else "outcome_unknown",
                          "failure_class": (
                              terminal["failure_class"] if terminal is not None else "interrupted"
                          ),
                          "usage": source["usage"],
                          "retry": logical_call_indexes[start["logical_call_id"]] > 1,
                          "exact_fingerprint_dispatch_ordinal": (
                              fingerprint_dispatches[fingerprint_key]
                              if fingerprint is not None
                              else None
                          ),
                          "started_at": start["timestamp"],
                          "terminal_event_id": (
                              terminal["event_id"] if terminal is not None else None
                          ),
                      }
                  )
              return projected


          def summarize(records: Iterable[Mapping[str, Any]]) -> dict[str, Any]:
              attempts = project_attempts(records)
              outcomes = Counter(item["outcome"] for item in attempts)
              token_fields = sorted(USAGE_FIELDS)
              sums = {field: 0 for field in token_fields}
              known = {field: True for field in token_fields}
              for attempt in attempts:
                  for field in token_fields:
                      value = attempt["usage"].get(field)
                      if value is None:
                          known[field] = False
                      else:
                          sums[field] += value
              usage = {field: sums[field] if known[field] else None for field in token_fields}
              retry_attempts = [item for item in attempts if item["retry"]]
              failed_attempts = [
                  item for item in attempts
                  if item["outcome"] not in {"success", "outcome_unknown"}
              ]
              failure_counts = Counter(
                  (item["logical_call_id"], item["failure_class"]) for item in failed_attempts
              )
              repeated_failures = sum(count - 1 for count in failure_counts.values())

              def _known_sum(items: Sequence[Mapping[str, Any]], field: str) -> int | None:
                  values = [item["usage"].get(field) for item in items]
                  return (
                      sum(values)
                      if all(isinstance(value, int) and not isinstance(value, bool) for value in values)
                      else None
                  )

              invalid_attempts = [
                  item for item in attempts if item["outcome"] == "response_invalid"
              ]
              duplicate_exact_fingerprint_dispatches = sum(
                  1
                  for item in attempts
                  if (
                      item["exact_fingerprint_dispatch_ordinal"] is not None
                      and item["exact_fingerprint_dispatch_ordinal"] > 1
                  )
              )
              # verified: tests/test_ai_call_receipt.py covers complete/incomplete projection.
              complete = bool(attempts) and not any(
                  item["outcome"] == "outcome_unknown" for item in attempts
              ) and known["input_tokens"] and known["output_tokens"]
              return {
                  "schema": "ai-call-receipt-summary/v1",
                  "attempts": len(attempts),
                  "logical_calls": len({item["logical_call_id"] for item in attempts}),
                  "outcomes": dict(sorted(outcomes.items())),
                  "usage": usage,
                  "retry": {
                      "attempts": len(retry_attempts),
                      "total_tokens": _known_sum(retry_attempts, "total_tokens"),
                  },
                  "repeated_failures": repeated_failures,
                  "invalid_output_tokens": _known_sum(invalid_attempts, "total_tokens"),
                  "duplicate_exact_fingerprint_dispatches": duplicate_exact_fingerprint_dispatches,
                  "cache": {
                      "read_tokens": usage["cache_read_tokens"],
                      "write_tokens": usage["cache_write_tokens"],
                  },
                  "telemetry_completeness": "complete" if complete else "incomplete",  # tests/test_ai_call_receipt.py
              }


          def _parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description=__doc__)
              subparsers = parser.add_subparsers(dest="command", required=True)
              for command in ("query", "summary", "verify"):
                  child = subparsers.add_parser(command)
                  child.add_argument("journal", type=Path)
                  child.add_argument("--provider")
                  child.add_argument("--status")
                  child.add_argument("--logical-call-id")
              return parser


          def main(argv: Sequence[str] | None = None) -> int:
              args = _parser().parse_args(argv)
              records = read_records(
                  args.journal,
                  provider=args.provider,
                  status=args.status,
                  logical_call_id=args.logical_call_id,
              )
              if args.command == "query":
                  for record in records:
                      print(json.dumps(record, sort_keys=True, separators=(",", ":")))
              elif args.command == "summary":
                  print(json.dumps(summarize(records), sort_keys=True))
              else:
                  project_attempts(records)
                  print(json.dumps({"schema": SCHEMA, "valid_records": len(records)}))
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except ReceiptError as exc:
                  print(f"ai-call-receipt: {exc}", file=sys.stderr)
                  raise SystemExit(2)
