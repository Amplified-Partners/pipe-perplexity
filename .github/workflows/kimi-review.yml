# Signed-by: cascade-mac (Cairn) | 2026-07-26 | session faf42a0c
# Independent review-only reviewer (Kimi/Moonshot substrate) — estate fan-out
# of the vault's scrubbed transport (fleet-config ai-review-reusable.yml,
# SSOT harness/scripts/ai_review.py). Key live-verified 2026-07-26 on the
# funded platform.kimi.ai account (org secret MOONSHOT_API_KEY). Review only:
# no approve, no merge, no PAT. Quorum is enforced by verifier-gate counting
# review sources, not by this check.
name: kimi-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: kimi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  kimi-review:
    if: github.event.pull_request.draft == false
    uses: Amplified-Partners/amplified-fleet-config/.github/workflows/ai-review-reusable.yml@main
    with:
      provider: kimi
    secrets: inherit
