              *,
              provider: str,
              route: str,
              requested_model: str,
              send: Callable[[], tuple[object, int | None]],
              parse: Callable[[object], _T],
              extract_actual_model: Callable[[object, _T], str | None],
              logical_call_id: str | None = None,
          ) -> _T:
              try:
                  started = start_attempt(
                      _receipt_journal(),
                      requested_provider=provider,
                      requested_route=route,
                      requested_model=requested_model,
                      scope=_receipt_scope(),
                      fingerprint=_receipt_fingerprint_input(provider, route, requested_model),
                      logical_call_id=logical_call_id,
                      writer=append_record,
