                  marker = f"🤖 **Kimi independent review** (review-only substrate, model {model})"
              else:
                  model = os.environ.get("OPENAI_REVIEW_MODEL") or _discover_openai_model(key)
                  marker = f"🤖 **OpenAI independent review** (review-only substrate, model {model})"

              prompt = PROMPT_PREFIX + diff + "\n```"

              # Seat-contract choke point: default-deny scrub before ANY payload leaves
              # the estate. Blocked or unrunnable => no review this run, visibly.
              try:
                  scrub = scrub_payload(prompt, provider=args.provider, model=model)
              except ScrubError as exc:
                  _record_dispatch_blocked(args.provider, model)
                  print(f"::warning::dispatch scrub could not run — refusing to send diff to {display}: {exc}")
                  return 0
              sanitization_receipt = ""
