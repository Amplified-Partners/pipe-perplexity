          def _post_with_retry(
              url: str,
              payload: dict,
              key: str,
              timeout: float,
              *,
              provider: str | None = None,
              parse: Callable[[object], _T] = lambda response: response,
              extract_actual_model: Callable[[object, _T], str | None] = (
                  lambda response, _parsed: (
                      response.get("model")
                      if isinstance(response, dict)
                      and isinstance(response.get("model"), str)
                      else None
                  )
              ),
          ) -> _T:
              """POST with bounded exponential backoff on 429/5xx and transport errors.

              Widened from 2 attempts / 1s on 2026-07-28. A single Kimi
              ``engine_overloaded_error`` 429 hard-failed agent-claude#85's required
              check; the identical rerun passed, so the outage was transient and the
              retry policy was simply too thin to absorb it. A required check that goes
              red on provider weather is a false signal in exactly the way the
              2026-07-23 quorum starvation was — it says "the review found a problem"
              when it means "the review could not be attempted".

              Bounded on purpose. The chain makes 7+ calls (4 primary, 2 cross, 1 final),
              so unbounded backoff would trade a 429 failure for a job timeout, which is
              not a fix. ``_RETRY_TOTAL_SLEEP_CAP`` is the ceiling on cumulative sleep
              for ONE call; once spent, the next failure raises instead of sleeping.
              Retry-After is honoured when the provider sends it — the provider knows
              its own recovery window better than a fixed schedule does — but it is
              clamped to the same cap so a hostile or mistaken header cannot stall the
              job.
              """
              data = json.dumps(payload).encode()
              provider = provider or next(
                  (
                      name
                      for name, config in PROVIDERS.items()
                      if config["url"] == url
                  ),
                  "unknown",
              )
              requested_model = str(payload.get("model") or "unknown")
              last: Exception | None = None
              delay = 1.0
              slept = 0.0
              logical_call_id = "call_" + uuid.uuid4().hex

              def _backoff(exc: Exception) -> bool:
                  """Sleep before the next attempt; False means the budget is spent."""
                  nonlocal delay, slept
                  wait = min(delay, _RETRY_MAX_SLEEP)
                  hinted = _retry_after_seconds(exc)
                  if hinted is not None:
                      wait = min(hinted, _RETRY_MAX_SLEEP)
                  if slept + wait > _RETRY_TOTAL_SLEEP_CAP:
                      return False
                  time.sleep(wait)
                  slept += wait
                  delay *= 2
                  return True

              for attempt in range(_RETRY_ATTEMPTS):
                  req = urllib.request.Request(
                      url,
                      data=data,
                      headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
                  )
                  try:
                      def send() -> tuple[object, int | None]:
                          with urllib.request.urlopen(
                              req, timeout=timeout, context=_SSL_CTX
                          ) as resp:
                              status = getattr(resp, "status", None)
                              return (
                                  json.loads(resp.read().decode("utf-8", errors="replace")),
                                  status if isinstance(status, int) else None,
                              )

                      result = _receipted_attempt(
                          provider=provider,
                          route="chat-completions",
                          requested_model=requested_model,
                          send=send,
                          parse=parse,
                          extract_actual_model=extract_actual_model,
                          logical_call_id=logical_call_id,
                      )
                      return result
                  except urllib.error.HTTPError as e:
                      last = e
                      retryable = e.code == 429 or 500 <= e.code < 600
                      if retryable and attempt + 1 < _RETRY_ATTEMPTS and _backoff(e):
                          continue
                      raise
                  except urllib.error.URLError as e:
                      last = e
                      if attempt + 1 < _RETRY_ATTEMPTS and _backoff(e):
                          continue
                      raise
              raise RuntimeError(f"unreachable retry state: {last}")


          def _discover_model(models_url: str, key: str, prefs: list, prefix: str, fallback: str) -> str:
              """Pick an available model instead of hardcoding a name that may retire or
              not exist on this endpoint (OpenAI HTTPError 2026-07-23; Kimi 404 on the
              global endpoint's missing 'kimi-latest' alias, same day). Exact prefs
              first, then newest id matching prefix (datecoded ids sort ascending),
              then any available id, then the fallback."""
              provider = next(
                  (
                      name
                      for name, config in PROVIDERS.items()
                      if models_url.startswith(config["url"].rsplit("/", 2)[0])
                  ),
                  "unknown",
              )
              try:
                  mreq = urllib.request.Request(
                      models_url, headers={"Authorization": "Bearer " + key}
                  )

                  def send() -> tuple[object, int | None]:
                      with urllib.request.urlopen(
                          mreq, timeout=60, context=_SSL_CTX
                      ) as resp:
                          status = getattr(resp, "status", None)
                          return (
                              json.loads(resp.read().decode("utf-8", errors="replace")),
                              status if isinstance(status, int) else None,
                          )

                  def select(response: object) -> str:
                      if not isinstance(response, dict) or not isinstance(
                          response.get("data"), list
                      ):
                          raise ValueError("model discovery returned an invalid response")
                      have = {
                          item["id"]
                          for item in response["data"]
                          if isinstance(item, dict) and isinstance(item.get("id"), str)
                      }
                      selected = next((preferred for preferred in prefs if preferred in have), None)
                      if selected is None:
                          prefixed = sorted(
                              (available for available in have if available.startswith(prefix)),
                              reverse=True,
                          )
                          selected = (
                              prefixed[0]
                              if prefixed
                              else (sorted(have)[0] if have else fallback)
                          )
                      return selected

                  model = _receipted_attempt(
                      provider=provider,
                      route="models",
                      requested_model=fallback,
                      send=send,
                      parse=select,
                      extract_actual_model=lambda _response, selected: selected,
                  )
                  print(f"model discovery: using {model}")
                  return model
              except Exception as e:  # noqa: BLE001 — any discovery failure means: use the fallback
                  print(f"model discovery failed ({type(e).__name__}) — defaulting to {fallback}", file=sys.stderr)
                  return fallback


          def _discover_openai_model(key: str) -> str:
              return _discover_model(
                  "https://api.openai.com/v1/models", key,
                  ["gpt-5-mini", "gpt-5-nano", "gpt-5", "gpt-4.1-mini", "o4-mini"],
                  "gpt-5", "gpt-5-mini",
              )


          def _discover_kimi_model(key: str) -> str:
              return _discover_model(
                  "https://api.moonshot.ai/v1/models", key,
                  ["kimi-latest"], "kimi-", "kimi-k2-0711-preview",
              )


          def main() -> int:
              ap = argparse.ArgumentParser(description=__doc__)
              ap.add_argument("--provider", required=True, choices=sorted(PROVIDERS))
              ap.add_argument("--diff", required=True, help="path to the captured PR diff")
              ap.add_argument("--out", required=True, help="review.json output path")
              ap.add_argument("--total-bytes-file", default="", help="path to full-diff byte count (coverage declaration)")
