                  # shape intact. This closes two measured outages at once: the
                  # credential-assignment refusals that starved quorum on #188, and the
                  # destruction-test vector where one decoy secret suppressed review of
                  # four real defects. Classes 3/4 (sensitive roots, pre-publication)
                  # are never redactable and still refuse below.
                  prompt = scrub.sanitized
