              except urllib.error.HTTPError as e:
                  # Surface status + API error message (never the key) so a dead model
                  # name or exhausted quota is diagnosable from the log.
                  detail = e.read()[:300].decode(errors="replace")
                  print(f"{display} HTTP {e.code} — no review produced: {detail}", file=sys.stderr)
                  return 0  # review.json absent => submit step warns; quorum enforced by verifier-gate
              except Exception as e:  # noqa: BLE001 — any transport/parse failure is "substrate absent"
                  # Print the MESSAGE, not just the class. The bare class made a real
                  # outage undiagnosable: Kimi failed for days as "unavailable
                  # (DeepSeekError)" — indistinguishable between a rejected key, a model
                  # the account cannot access, and a malformed response body. Meanwhile
                  # verifier-gate needs >=2 live sources, so a silent substrate is a
                  # permanent merge deadlock that no log explains. str(e) here carries the
                  # provider's own text (endpoint/model/parse detail); the API key is never
                  # part of an exception message, only of the request headers.
                  print(f"{display} unavailable ({type(e).__name__}: {e}) — no review produced",
                        file=sys.stderr)
                  return 0

